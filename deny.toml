# cargo-deny, for both crates: `core/` and `app/rust/`. Run by the `deny` job
# in build.yml, and locally with
#
#   cargo deny --manifest-path core/Cargo.toml --config deny.toml check
#
# `tools/*` are benchmark harnesses that ship in no build, and are left out.

[graph]
all-features = false

[advisories]
# RustSec. CI reports these and does not fail on them -- see the `deny` job --
# because an advisory arrives on a date, not with a commit.
yanked = "warn"
ignore = []

[licenses]
# The app is GPL-3.0-or-later, so every licence here has to be one that can be
# combined into a GPLv3 work. Each entry is on the list because a dependency in
# one of the two lock files uses it, not as a pre-approved menu: adding a new
# one is a decision, and this file is where it gets made.
#
# Before adding anything, check `docs/licences.md` too -- that is the page the
# app's users see, and a dependency whose licence needs attribution needs a line
# there as well.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    # webpki-roots: Mozilla's root store, as data.
    "CDLA-Permissive-2.0",
    # This repository's own crates.
    "GPL-3.0-or-later",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate is common in a tree this size and not a fault.
multiple-versions = "allow"
# crates.io refuses wildcard requirements, and the only ones here are path
# dependencies between this repository's own crates.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# deep_filter, pinned to a commit in core/Cargo.toml.
allow-git = ["https://github.com/Rikorose/DeepFilterNet"]
