[package]
name = "rust_lib_mumbleway"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# The whole client engine lives in the core crate; this crate is only the
# Flutter-facing shim, so the protocol and audio code stays testable on its own.
mumbleway-core = { path = "../../core" }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
anyhow = "1"
rustls-pemfile = "2"
serde_json = "1.0.151"

# Process CPU and memory for the diagnostics panel come from `src/usage.rs`,
# which asks each platform in the way that platform will answer. The
# dependencies below are per-target for that reason, and the reasoning is in
# that file: `sysinfo` reports 0% CPU on both phones, for two different causes.

# `/proc/self` on Android and Linux -- `sysconf` for the clock tick and page
# size, which are the two constants the parse needs.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

# Mach on iOS and macOS, which answers for the current task inside the sandbox
# where `sysinfo` compiles its process refresh to a stub.
#
# 0.6 and not 0.4: `mach_task_basic_info` and `task_thread_times_info` are not
# under `mach2::task_info` in 0.4, and since no Windows or Android build
# compiles this branch, the mismatch would first appear in a macOS CI job.
# `tools/usageprobe` carries the same code so it can be typechecked with
# `cargo check --target aarch64-apple-ios` from any host, which is how this was
# caught.
[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.6"

# Windows, where `sysinfo` works and there is nothing to work around. Default
# features pull in every subsystem the crate can read; only this process is
# ever inspected.
[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# Android only. cpal's backend asks `ndk_context` for the JVM and the app
# Context so it can reach the Java audio APIs, and panics outright if nobody
# has registered them. Nothing does that in a Flutter app — there is no
# `ndk-glue` main here, only a library loaded into someone else's process — so
# the app has to hand them over itself. See `android_context` in api/mumbleway.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Always optimise the native audio dependencies, even in debug builds.
#
# Two reasons, both necessary:
#
# 1. Correctness on Windows. `audiopus_sys` builds libopus with the `cmake`
#    crate, which infers CMAKE_BUILD_TYPE from opt-level: at opt-level 0 it
#    picks Debug, so libopus links the *debug* CRT (/MDd) and pulls in
#    _CrtDbgReportW. Rust's MSVC target always uses the release CRT, so the
#    link fails with unresolved externals. Any non-zero opt-level selects a
#    release-CRT build type and the mismatch disappears.
#
# 2. Realtime headroom. Opus and RNNoise run on every 10 ms block; compiled
#    unoptimised they are far too slow to keep up, so a debug build would
#    glitch constantly even though it "works".
[profile.dev.package.audiopus_sys]
opt-level = 2

[profile.dev.package.opus]
opt-level = 2

[profile.dev.package.nnnoiseless]
opt-level = 2
