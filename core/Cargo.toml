[package]
name = "mumbleway-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Cross-platform Mumble client core: protocol, crypto, audio and reconnect logic"
# Matches the GPL-3.0 LICENSE at the repository root.
license = "GPL-3.0-or-later"

[lib]
name = "mumbleway_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# --- speech enhancement ----------------------------------------------------
# DeepFilterNet 3, at the head of the capture chain.
#
# From git rather than crates.io: the published `deep_filter` stopped at 0.2.5
# in July 2022, which is the DFN1/2 era. DFN3 lives only in the repository, so
# this is pinned to a commit rather than a version.
#
# `default-features = false` drops `vorbis` and `flac`, which exist for the
# crate's own file-reading binaries and would pull audio decoders this project
# already has no use for. What is kept is `tract` -- a pure-Rust inference
# engine, so there is no native runtime to cross-compile for five targets, the
# thing that confined the YAMNet classifier to Dart -- and the embedded DFN3
# weights, which are dual-licensed MIT and Apache-2.0 like the code.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = [
    "tract",
    "default-model-ll",
] }

# Pinned, and not tidiness: `deep_filter` asks for `tract-hir = "^0.21.4"`,
# which resolves forward to 0.21.14 — and 0.21.14 removed `Graph::symbol_table`
# and changed several signatures, so the crate does not compile against it.
# 0.21.4 is what DeepFilterNet's own Cargo.lock uses. Declared here rather than
# left to `cargo update --precise`, because a pin that only exists in a lock
# file is one `cargo update` away from being gone.
#
# Nothing in this project calls tract directly. These entries exist to hold the
# version, and can go when `deep_filter` catches up.
tract-core = "=0.21.4"
tract-hir = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"

# The array type `deep_filter`'s own API takes and returns. Version matched to
# what it resolves, so the two are the same `Array2` rather than two identical
# ones the compiler will not accept for each other.
ndarray = "0.15"

# --- async runtime / networking -------------------------------------------
tokio = { version = "1", features = [
    "rt-multi-thread", "net", "time", "sync", "macros", "io-util",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
webpki-roots = "0.26"

# --- protocol --------------------------------------------------------------
prost = "0.13"
bytes = "1"

# --- crypto ----------------------------------------------------------------
aes = "0.8"
cipher = "0.4"
aes-gcm = "0.10"
rand = "0.8"

# --- audio -----------------------------------------------------------------
cpal = "0.18"
opus = "0.3"
nnnoiseless = { version = "0.5", default-features = false }

# WebRTC's AEC3, for `audio::aec3`.
#
# **Why a new echo canceller at all:** build 123 measured a real room at 140 ms
# of echo spread (440 at p90) against a filter covering 21.3, and it removed a
# median of 0.2 dB. `audio::aec::_WHY_NO_GROWTH` records why that filter cannot
# simply be made longer — a single-power normalisation converges worse the
# further it spans. AEC3 is a partitioned block frequency-domain filter with
# per-bin normalisation, which is the property the time-domain one lacks. On
# the OPPO it measured 400 µs against 970 and forty decibels better.
#
# **Why this port and not WebRTC's own module:** Sonora is pure Rust (M145),
# BSD-3-Clause — which this repository's GPL-3.0-or-later can absorb — and needs
# no C++ toolchain across five cross-compiled targets. The alternative is the
# extraction PulseAudio and PipeWire use, with a Meson build in front of iOS,
# Android, macOS and Windows.
#
# **The risk, stated:** 0.2.0, published a fortnight before this landed. That is
# why `audio::aec` keeps the time-domain filter reachable behind `set_use_aec3`
# rather than deleting it.
sonora = "0.2"

# --- misc ------------------------------------------------------------------
thiserror = "2"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
hex = "0.4.3"
url = "2.5.8"

[build-dependencies]
prost-build = "0.13"

# tract-core, with one hunk changed. See third_party/tract-core/PATCH.md.
#
# Not a preference and not a version pin dressed up as one: the vendored plain
# DFN3 -- the enhancer rung that keeps a slow phone enhancing instead of losing
# the enhancer -- **cannot be loaded by any released tract**, because
# `add_const` deduplicates constants by value and then mints their name without
# checking it is free. The patch asks the second question too.
#
# 0.21.5 has the identical code, and 0.21.6 drops `Graph::symbol_table`, which
# `deep_filter` uses -- so there is no version to move to instead.
# What this process costs, for the diagnostics panel and for the relief
# ladder's CPU rung. Per-target because each platform has to be asked in the
# way it will answer -- the reasoning, and the two ways sysinfo reports 0% on a
# phone, are in `src/usage.rs`.

# `/proc/self` on Android and Linux: `sysconf` for the clock tick and page size.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

# Mach on iOS and macOS, which answers for the current task inside the sandbox
# where sysinfo compiles its process refresh to a stub.
#
# 0.6 and not 0.4: `mach_task_basic_info` and `task_thread_times_info` are not
# under `mach2::task_info` in 0.4. `tools/usageprobe` carries the same code so
# `cargo check --target aarch64-apple-ios` can typecheck it from any host.
[target.'cfg(target_vendor = "apple")'.dependencies]
mach2 = "0.6"

# Windows, where sysinfo works and there is nothing to work around.
[target.'cfg(target_os = "windows")'.dependencies]
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[patch.crates-io]
tract-core = { path = "../third_party/tract-core" }


# The same three pins `app/rust/Cargo.toml` carries, and for the same reason.
#
# The `cmake` crate infers `CMAKE_BUILD_TYPE` from `opt-level`, so an
# unoptimised build compiles libopus against the *debug* CRT (`/MDd`) while
# Rust's MSVC target always links the release one. The link then fails with
# `unresolved external symbol __imp__CrtDbgReportW`, from every Opus object
# that contains an `assert`.
#
# It was missing here and the tests still passed, because the artifacts had
# been built once under conditions that happened to work and nothing since had
# forced a rebuild. A `cargo clean` was enough to expose it. These also run on
# every 10 ms block and are too slow unoptimised to hold realtime, so the pin
# is correct on its own merits.
[profile.dev.package.audiopus_sys]
opt-level = 2

[profile.dev.package.opus]
opt-level = 2

[profile.dev.package.nnnoiseless]
opt-level = 2
