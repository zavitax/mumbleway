name: listing

# The store *listing* — the page, not a release.
#
# Separate from `publish.yml` because it carries no package and makes no
# build. The description, the short description and the title are one page per
# language for the whole app, independent of any version, and they go stale on
# their own: a link rots, a control gets renamed, and nothing in a release
# pipeline notices. This is how they are put right without shipping anything.
#
# ## Why only Google Play
#
# Because Play is the only one of the three where a listing change is a listing
# change. The other two are decisions, and `tool/push_app_store_listing.mjs`
# and `tool/push_ms_store_listing.py` are run by a person for that reason:
#
# - **Apple's description belongs to a version record**, and a released
#   version's is frozen. Changing the text means creating the next version —
#   that is deciding to ship, not fixing a page.
# - **Microsoft's starts a certification run** of hours to days, and a
#   submission in flight blocks the next one. `publish.yml` already writes that
#   text into the same submission as the package, which is one certification
#   run instead of two. When that commit fails and leaves a draft staged,
#   `msstore.yml` finishes it — still one run, and still not a button.
#
# Play has neither property, so it is the one that can be a button.
#
# ## Why a workflow rather than a laptop
#
# The service-account key exists only as a repository secret. That is the
# arrangement this project wants — nobody's credentials sit on a developer
# machine — and the cost of it is that the one store that *can* be fixed
# without a release could not be fixed at all. This closes that.
#
# The key is written to a file and only its path is passed as an argument:
# an argument is visible in the process list, and `zavitax/mumbleway` is
# public. CLAUDE.md records the same rule for the App Store key.
#
# ## It is also the only way to read Play from here
#
# With `commit` unchecked this reports rather than writes, so it doubles as the
# status read — and that turned out to be the only one available. Asked "is
# 1.2.0 rolled out?" on 14 November 2026 there was no way to answer: the key is
# a repository secret by design, and `play.google.com` resets the TLS
# connection from this network, so the public page is no help either.
# `read_play_listing.mjs` already notes why that happens and that
# `androidpublisher.googleapis.com` is a different host and generally reachable
# — which is the route this takes.

on:
  workflow_dispatch:
    inputs:
      # Default off, like every other write in this repository. A run with it
      # unchecked prints what differs and changes nothing, which is also the
      # way to see what a commit would do before committing it.
      commit:
        description: 'Write it to Play for real (unchecked: report what differs, change nothing)'
        required: false
        default: false
        type: boolean

jobs:
  play:
    name: Google Play listing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Before anything is sent. Play truncates nothing and refuses nothing
      # quietly -- it rejects the whole edit -- and the Russian description
      # runs longer than the English for the same meaning, so this is the
      # check that catches a field that fits in one language and not the
      # other. Cheap, and it fails before the key is even written.
      - name: Measure the copy
        run: python tool/check_listing.py

      - name: Write the key
        env:
          PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT" ]; then
            echo '::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON is not set, so there is nothing to authenticate with. Every job in publish.yml skips cleanly without its secrets; this one fails, because a listing push that silently did nothing would read as a listing that was pushed.'
            exit 1
          fi
          umask 077
          printf '%s' "$PLAY_SERVICE_ACCOUNT" > "$RUNNER_TEMP/play-key.json"

      - name: Push the listing
        run: |
          node tool/push_play_listing.mjs "$RUNNER_TEMP/play-key.json" \
            ${{ inputs.commit && '--push --commit' || '' }}

      # Runs in both modes, and means a different thing in each.
      #
      # With `commit` unchecked this is the status read: `push_play_listing.mjs`
      # prints `production track: <name>`, and that name is taken from any
      # production release carrying version codes — **a draft counts**. So it
      # answers which version is on production and not whether anybody can
      # install it, which is the question actually being asked after a release.
      # `read_play_listing.mjs` prints every track with each release's `status`,
      # so `draft` and `completed` are told apart.
      #
      # With `commit` checked it is the read-back. A listing goes live without
      # review, so "committed" is a claim worth checking rather than trusting,
      # and the same output then shows the new text in the console.
      #
      # `if: always()` so a failed push is still followed by a statement of
      # what the store is left holding — which is the moment it matters most.
      # It opens its own edit and deletes it in a `finally`; there is no commit
      # path in that file and there must never be one.
      #
      # The key is checked for in the shell rather than with `hashFiles` in the
      # `if:`, because `hashFiles` only looks inside `GITHUB_WORKSPACE` and the
      # key is deliberately outside it. As an `if:` guard it would return empty
      # for ever and the step would silently never run — a check that always
      # passes and a check that never does look identical from the run list.
      - name: What Play actually holds
        if: always()
        run: |
          if [ ! -f "$RUNNER_TEMP/play-key.json" ]; then
            echo "No key was written, so there is nothing to read."
            exit 0
          fi
          node tool/read_play_listing.mjs "$RUNNER_TEMP/play-key.json"

      # An edit left open holds the listing against the next one, and
      # `withEdit` already deletes it in a `finally`. This is the key itself:
      # the runner is ephemeral, but a file holding a private key should not
      # outlive the step that needed it even so.
      - name: Shred the key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-key.json"
