  tagline: Связь для байкеров
  description: >-
    Клиент Mumble, сделанный под шум ветра и мотора в шлеме.
    Windows, macOS, iOS, iPadOS и Android.

  skip: Перейти к содержанию
  close: Закрыть
  menu: Меню
  sections: Разделы
