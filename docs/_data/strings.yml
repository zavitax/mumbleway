  figures:
    range:
      title: Дальность интеркома против интернет-канала
      desc: >-
        Слева Bluetooth-интерком: двое внутри пунктирного круга связаны, а
        третий, отставший, оказался за его пределами и связи нет. Справа те же
        трое на тех же расстояниях подключены к серверу Mumble, и расстояния
        между ними больше ничего не значат.
      intercom: BLUETOOTH-ИНТЕРКОМ
      intercom_range: несколько сотен метров
      out_of_range: вне зоны
      server: ваш сервер Mumble
      internet_range: сто метров или другая страна
      caption: >-
        Интерком — это радиосвязь между шлемами, и она кончается там, где
        кончается радио. Канал на своём сервере убирает расстояние из задачи —
        и заменяет его необходимостью связи. В этом размене и состоит всё
        приложение.

    timeline:
      title: Как голосовая активация открывает и закрывает канал
      desc: >-
        Три дорожки одна над другой. Слово звучит с 200-й по 560-ю миллисекунду.
        Детектор уверен в нём только с 250-й по 520-ю: он теряет первый
        согласный и отпускает раньше последнего. В эфир уходит отрезок с 200-й
        по 600-ю: упреждение в 80 мс возвращает начальный согласный, а хвост в
        200 мс доносит конечный, затухая на последних 30 мс.
      you_say: Вы говорите
      detector: Детектор
      transmitted: В эфир
      detected: речь обнаружена
      on_the_wire: идёт передача
      lookahead: упреждение 80 мс
      tail: хвост 200 мс
      fade: затухание 30 мс
      caption: >-
        Порог принимает решение посреди слога. Задержка звука на 80 мс
        позволяет открыть канал на том звуке, который <em>привёл</em> к
        решению, — начальный согласный уцелевает; хвост в 200 мс доносит
        конечный и затухает в самом конце, чтобы не щёлкнуло.

    passenger:
      title: Как водитель и пассажир создают петлю обратной связи
      desc: >-
        Два шлема в тридцати сантиметрах друг от друга, в одном канале. Динамик
        пассажира слышен микрофону водителя, тот отправляет звук обратно в
        динамик пассажира, и микрофон водителя слышит его снова — петля растёт,
        пока не завоет. Достаточно убавить один динамик, чтобы её разорвать.
      heading: ВОДИТЕЛЬ И ПАССАЖИР, ОДИН КАНАЛ
      rider: водитель
      passenger: пассажир
      loop_out: динамик — в чужой микрофон
      loop_back: и сразу обратно
      fix_heading: РАЗОРВАТЬ ГДЕ УГОДНО
      fix1: Убавьте громкость одного динамика.
      # Worded to match the app's own setting, "Обрывать только при нарастании
      # воя", shortened to fit the figure. A diagram that names a control
      # differently from the screen it describes sends the reader looking for
      # something that is not there.
      fix2: 'Подавление обратной связи: обрывать при вое.'
      fix3: Не помогло — переведите пассажира на кнопку.
      fix_note: Петле нужны все звенья. Хватит убрать одно.
      caption: >-
        Два микрофона в двух шлемах в тридцати сантиметрах друг от друга, в
        одном канале, — самый простой способ получить петлю обратной связи:
        каждый динамик достаёт до чужого микрофона, и усиление идёт по кругу.
        Чтобы её разорвать, достаточно убрать одно звено.

    group:
      title: Группа, растянувшаяся по дороге, вся в одном канале
      desc: >-
        Пятеро растянулись на восемь километров дороги. Bluetooth-интерком
        связал бы только тех двоих, кто случайно оказался рядом, разбив группу
        на куски. Вместо этого у каждого своё соединение с одним и тем же
        сервером Mumble, и интервалы между ними не значат ровно ничего.
      heading: ПЯТЕРО, ВОСЕМЬ КИЛОМЕТРОВ
      front: голова
      back: хвост
      fuel: встал на заправку
      intercom_reach: докуда достал бы интерком
      server: один канал, один сервер
      caption: >-
        Ради этого случая всё и делалось. Группа не едет строем: кто-то встал
        на заправку, кто-то попал на красный, кто-то просто быстрее. На
        интеркоме группа незаметно распадается на куски, каждый из которых
        слышит сам себя. В одном канале интервалы не значат ничего.

    tunnel:
      title: Что происходит, когда пропадает связь
      desc: >-
        Дорога через тоннель, в трёх стадиях. До него связь есть и разговор
        идёт. Внутри нет данных и нет голоса совсем — это честное ограничение.
        На выходе приложение переподключается само и проигрывает накопившееся
        быстрее реального времени, вместо того чтобы оставить всех отставшими
        на секунду.
      heading: НЕТ СВЯЗИ — НЕТ РАЗГОВОРА
      before: связь есть
      before_note: разговор идёт
      inside: данных нет
      inside_note: не проходит ничего
      after: снова в эфире
      after_note: переподключается и догоняет
      caption: >-
        Это главная слабость, и никакой настройкой она не лечится. Приложение
        умеет вернуться само и догнать, вместо того чтобы навсегда оставить всю
        группу отставшей на секунду, — но пока нет данных, нет и голоса, и
        именно здесь интерком продолжал бы работать.
