      title: "Как блок звука доходит от шлема до остальных"
      desc: >-
        Один ряд ступеней слева направо: микрофон, подавление эха, полоса речи,
        очиститель, смешение, гейт, уровень, подъём, лимитер и выход к
        остальным. Сплошные стрелки — сам звук, он проходит все ступени именно
