{%- assign f = site.data.strings[include.lang].figures.conditions -%}
<!-- The same chain, in the three conditions it is built for.

     The point of the drawing is that the *stages do not change* — every row
     runs the chain in fig-chain.svg, in the same order — and only one number
     differs: the signal-to-noise ratio measured in the first second after the
     gate opens, which is what `Auto` chooses a profile from. The thresholds
     drawn here are `SNR_HELMET_BELOW_DB` and `SNR_STANDARD_BELOW_DB` in
     core/src/audio/denoise.rs.

     The envelopes are illustrative rather than measured, and the caption says
     so. Drawing a real capture at this size would show a grey smear: what a
     reader needs from this is which of the two bands the chain removes and
     which it keeps, and that is a shape rather than a number.

     What is *not* drawn, deliberately: the gate's one-second hold. Silence
     between the bursts inside a row is not the channel shutting — it holds
     open across gaps that size, which is what stops a sentence arriving as
     three fragments. -->
<figure class="figure">
<svg viewBox="0 0 1020 300" role="img" aria-labelledby="cd-title cd-desc" class="fig">
  <title id="cd-title">{{ f.title }}</title>
  <desc id="cd-desc">{{ f.desc | strip_newlines }}</desc>

  <defs>
    <marker id="cd-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8695A6"/>
    </marker>
  </defs>

  <g font-family="inherit">
    <!-- Column headings. -->
    <g font-size="11" fill="#8695A6">
      <text x="366" y="42" text-anchor="middle">{{ f.heard }}</text>
      <text x="776" y="42" text-anchor="middle">{{ f.sent }}</text>
    </g>

    <!-- The strips: background, the noise band that survives, and the speech
         on top of it. -->
    <g>
      <rect x="196" y="54" width="340" height="44" rx="3" fill="#263140" stroke="#33404F"/>
      <rect x="196" y="93" width="340" height="5" fill="#4E6076"/>
      <path d="M 196 98 L 219.8 98 Q 264 64 308.2 98 L 321.8 98 Q 366 69 410.2 98 L 423.8 98 Q 468 62 512.2 98 L 536 98 Z" fill="#3ECF7E" opacity="0.75"/>
      <rect x="606" y="54" width="340" height="44" rx="3" fill="#263140" stroke="#33404F"/>
      <rect x="606" y="96" width="340" height="2" fill="#4E6076"/>
      <path d="M 606 98 L 629.8 98 Q 674 64 718.2 98 L 731.8 98 Q 776 69 820.2 98 L 833.8 98 Q 878 62 922.2 98 L 946 98 Z" fill="#3ECF7E" opacity="0.9"/>

      <rect x="196" y="134" width="340" height="44" rx="3" fill="#263140" stroke="#33404F"/>
      <rect x="196" y="159" width="340" height="19" fill="#4E6076"/>
      <path d="M 196 178 L 219.8 178 Q 264 142 308.2 178 L 321.8 178 Q 366 147 410.2 178 L 423.8 178 Q 468 140 512.2 178 L 536 178 Z" fill="#3ECF7E" opacity="0.75"/>
      <rect x="606" y="134" width="340" height="44" rx="3" fill="#263140" stroke="#33404F"/>
      <rect x="606" y="176" width="340" height="2" fill="#4E6076"/>
      <path d="M 606 178 L 629.8 178 Q 674 145 718.2 178 L 731.8 178 Q 776 150 820.2 178 L 833.8 178 Q 878 143 922.2 178 L 946 178 Z" fill="#3ECF7E" opacity="0.9"/>

      <rect x="196" y="214" width="340" height="44" rx="3" fill="#263140" stroke="#33404F"/>
      <rect x="196" y="229" width="340" height="29" fill="#4E6076"/>
      <path d="M 196 258 L 219.8 258 Q 264 220 308.2 258 L 321.8 258 Q 366 225 410.2 258 L 423.8 258 Q 468 218 512.2 258 L 536 258 Z" fill="#3ECF7E" opacity="0.75"/>
      <rect x="606" y="214" width="340" height="44" rx="3" fill="#263140" stroke="#33404F"/>
      <rect x="606" y="256" width="340" height="2" fill="#4E6076"/>
      <path d="M 606 258 L 629.8 258 Q 674 226 718.2 258 L 731.8 258 Q 776 231 820.2 258 L 833.8 258 Q 878 224 922.2 258 L 946 258 Z" fill="#3ECF7E" opacity="0.9"/>
    </g>

    <!-- Which condition, and what the chain measured. -->
    <g font-size="11">
      <text x="8" y="72" fill="#DDE6EF">{{ f.quiet }}</text>
      <text x="8" y="88" font-size="10" fill="#8695A6">{{ f.quiet_snr }}</text>
      <text x="8" y="152" fill="#DDE6EF">{{ f.wind }}</text>
      <text x="8" y="168" font-size="10" fill="#8695A6">{{ f.wind_snr }}</text>
      <text x="8" y="232" fill="#DDE6EF">{{ f.engine }}</text>
      <text x="8" y="248" font-size="10" fill="#8695A6">{{ f.engine_snr }}</text>
    </g>

    <!-- The one thing that differs between the rows. -->
    <g font-size="10" text-anchor="middle">
      <path d="M 546 76 L 596 76" stroke="#8695A6" stroke-width="1.5"
            marker-end="url(#cd-arrow)" fill="none"/>
      <text x="571" y="68" fill="#3ECF7E">{{ f.p_light }}</text>
      <path d="M 546 156 L 596 156" stroke="#8695A6" stroke-width="1.5"
            marker-end="url(#cd-arrow)" fill="none"/>
      <text x="571" y="148" fill="#FFA53C">{{ f.p_standard }}</text>
      <path d="M 546 236 L 596 236" stroke="#8695A6" stroke-width="1.5"
            marker-end="url(#cd-arrow)" fill="none"/>
      <text x="571" y="228" fill="#FF5D5D">{{ f.p_helmet }}</text>
    </g>

    <!-- What the two fills mean, said once. -->
    <g font-size="10">
      <rect x="196" y="274" width="18" height="9" fill="#4E6076"/>
      <text x="222" y="283" fill="#B9C4D0">{{ f.legend_noise }}</text>
      <rect x="360" y="274" width="18" height="9" fill="#3ECF7E" opacity="0.9"/>
      <text x="386" y="283" fill="#B9C4D0">{{ f.legend_speech }}</text>
      <text x="606" y="283" fill="#61707F">{{ f.note_same }}</text>
    </g>
  </g>
</svg>
<figcaption>{{ f.caption | strip_newlines }}</figcaption>
</figure>
