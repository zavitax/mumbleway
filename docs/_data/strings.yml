  figures:
    chain:
      title: "How a block of sound gets from the helmet to the others"
      desc: >-
        A single row of stages, left to right: microphone, echo canceller,
        speech band, enhancer, blend, gate, level, restore, limiter, and out to
        the others. Solid arrows are the sound itself, which passes through
        every stage in that order. Dashed arrows underneath carry information
        rather than sound: the background level and the signal-to-noise ratio
        pick the profile and set the gate's threshold, a voice test decides
        whether the gate opens, and what the enhancer removed tells the restore
        stage what to put back.
      playback: "what the others are saying"
      reference: "reference"
      mic: "Microphone"
      mic_sub: "in the helmet"
      s_echo: "Echo"
      s_echo_sub: "AEC3"
      s_band: "Band"
      s_band_sub: "speech only"
      s_enhancer: "Enhancer"
      s_enhancer_sub: "DeepFilterNet 3"
      s_blend: "Blend"
      s_blend_sub: "by profile"
      s_gate: "Gate"
      s_gate_sub: "with look-ahead"
      s_level: "Level"
      s_level_sub: "automatic"
      s_restore: "Restore"
      s_restore_sub: "on the voice"
      s_limit: "Limiter"
      s_limit_sub: "always last"
      out: "To the others"
      out_sub: "Opus, 20 ms"
      i_profile: "Profile"
      i_profile_sub: "from the first second of speech"
      i_voice: "Is this a voice?"
      i_voice_sub: "VAD, pitch, margin"
      i_took: "What the enhancer removed"
      i_took_sub: "and in which band"
      i_floor: "The background level, measured continuously"
      i_floor_sub: "the quietest it has been lately, not the average"
      legend_sound: "sound"
      legend_info: "information"
      note_echo: "first, or every later stage passes it"
      note_limiter: "last, or it is not a limiter"
      footnote: "The order is the code's own, not a tidied version of it."
      caption: >-
        Every sample takes the green path, in that order. The amber boxes are
        never heard: they are measurements taken off the signal that change how
        a later stage behaves. That distinction is worth holding on to when
        reading the diagnostics panel — the voice test removes nothing, it only
        decides whether the gate opens.
    conditions:
      title: "The same chain, in the three conditions it is built for"
      desc: >-
        Three rows, one per condition. Each shows what the microphone hears on
        the left and what the others receive on the right. Standing still, the
        background is a thin band and speech passes almost untouched. At speed,
        wind is a thick band that is gone from the transmitted side. At a
        stoplight beside running engines the band is thicker still and is also
        gone. The stages are identical in all three rows; only the profile
        differs, chosen from the measured signal-to-noise ratio.
      heard: "what the microphone hears"
      sent: "what the others get"
      quiet: "Standing still, or indoors"
      quiet_snr: "signal-to-noise above 35 dB"
      wind: "Wind, at speed"
      wind_snr: "between 20 and 35 dB"
      engine: "Engines, at a stoplight"
      engine_snr: "below 20 dB"
      p_light: "Light"
      p_standard: "Standard"
      p_helmet: "Helmet"
      legend_noise: "background"
      legend_speech: "speech"
      note_same: "Same stages in all three. Only the profile differs."
      caption: >-
        Illustrative shapes rather than a measured capture: at this size a real
        one is a grey smear, and what matters here is which band the chain
        removes and which it keeps. Automatic picks the profile from the
        signal-to-noise ratio of the first second after the gate opens, and
        reconsiders when the background moves. The gaps inside a row are not
        the channel shutting — it holds open for a second, which is what stops
        one sentence arriving as three fragments.
    aec:
      title: "How the echo canceller works"
      desc: >-
        Above, the helmet: what the others say goes to the speaker, and the
        microphone picks up both the rider's own voice and the speaker's sound
        again, late and coloured by the path. Below, the canceller: a copy of
        what was played is kept as a reference, the offset between it and the
        echo is measured, an adaptive filter models the path, and the result is
        subtracted from the microphone signal. Whatever the subtraction cannot
        reach is suppressed separately. ERLE is how much came off.
      room: "inside the helmet"
      far: "What the others say"
      far_sub: "known exactly"
      speaker: "Speaker"
      mic: "Microphone"
      near: "Your voice"
      echo: "the same sound again, late and coloured"
      residual: "Residual echo"
      residual_sub: "suppressed separately"
      to_chain: "on into the rest of the chain"
      reference: "a copy, kept to be subtracted"
      delay: "Where is the echo?"
      delay_sub: "the offset is measured, not assumed"
      filter: "Model of the path"
      filter_sub: "adapts while the far end talks"
      estimate: "what the echo should look like"
      erle: "ERLE, how much came off"
      erle_sub: "shown in Diagnostics"
      note_delay: >-
        A helmet speaker returns in about a millisecond. A phone on
        loudspeaker returns after the mixer, the resampler, the buffer and the
        hardware, so the offset is found rather than assumed.
      note_double: >-
        Claim the microphone hands this job to the phone as well. Two
        cancellers on one echo is worse than either alone, and Echo returned in
        Diagnostics is how to see it.
      caption: >-
        This works because one of the two sounds arriving at the microphone is
        known exactly: the app played it. Nothing gives the same advantage over
        wind, which is why the rest of the chain is so much harder than this
        part. Read Echo returned as a comparison between settings rather than
        against a threshold — the figure depends on the output volume, which
        nothing in the app knows.
    range:
      title: Intercom range against an internet channel
      desc: >-
        On the left, a Bluetooth intercom: two riders inside a dashed circle are
        connected, and a third who has fallen behind sits outside it,
        disconnected. On the right, the same three riders at the same distances
        all connect to a Mumble server, and the distances between them no
        longer matter.
      intercom: BLUETOOTH INTERCOM
      intercom_range: a few hundred metres
      out_of_range: out of range
      server: your Mumble server
      internet_range: a hundred metres, or another country
      caption: >-
        An intercom is a radio link between helmets, and it ends where the radio
        does. Putting the channel on a server you control removes distance from
        the problem — and replaces it with needing a signal, which is the trade
        this whole app is.

    ladder:
      title: What a slow device gives up, and in what order
      desc: >-
        Eight steps descending from left to right. The speech enhancer softens
        first, then the look-ahead pay-down stops, then the echo canceller's
        filter halves, then three cheap detectors, then the diagnostics panel's
        own drawing, then its live dots and meters, then a cheaper noise
        model, and last of all the enhancer is switched off altogether.
      enhancer_soft: enhancer softens
      paydown: pay-down stops
      echo_filter: echo filter halves
      detectors: cheap detectors
      display: panel drawing
      dots: live dots stop
      simple_model: cheaper model
      enhancer_off: enhancer off
      first: given up first
      last: given up last
      axis: cheapest quality first
      caption: >-
        The order is measured, not guessed. The two cheapest things to give up
        are also the two largest savings, and the one that costs the most
        &mdash; the enhancer, which turns 1.5&nbsp;dB of separation into
        16&nbsp;dB &mdash; is the last thing tried rather than the first.
    timeline:
      title: How voice activation opens and closes the channel
      desc: >-
        Three stacked tracks. The spoken word runs from 200 to 560
        milliseconds. The detector only recognises it from 250 to 520, missing
        the first consonant and dropping before the last. What is transmitted
        runs from 200 to 720: a 240 millisecond look-ahead recovers the opening
        consonant, and a one second tail carries the closing one and bridges
        the gaps inside the sentence, fading over its final 30 milliseconds.
      you_say: You say
      detector: Detector
      transmitted: Transmitted
      detected: speech detected
      on_the_wire: on the wire
      lookahead: 240 ms look-ahead
      tail: 1 s tail
      fade: 30 ms fade
      caption: >-
        A threshold decides mid-syllable. Holding the audio back by 240 ms lets
        the channel open on the sound that <em>led into</em> the decision, so
        the opening consonant survives; a one second tail carries the closing one,
        fading at the very end so it does not click.

    passenger:
      title: How a rider and passenger build a feedback loop
      desc: >-
        Two helmets a foot apart on the same channel. The passenger's speaker is
        heard by the rider's microphone, which sends it back to the passenger's
        speaker, which the rider's microphone hears again — a loop that climbs
        until it howls. Turning one speaker down breaks it.
      heading: RIDER AND PASSENGER, ONE CHANNEL
      rider: rider
      passenger: passenger
      loop_out: speaker into the other's microphone
      loop_back: and straight back again
      fix_heading: BREAK IT ANYWHERE
      fix1: Turn one speaker volume down.
      fix2: 'Feedback suppression: cut when a howl builds.'
      fix3: Failing that, put the passenger on push to talk.
      fix_note: A loop needs every step. Removing one is enough.
      caption: >-
        Two microphones inside two helmets a foot apart, both on the same
        channel, is the easiest way there is to build a feedback loop — each
        speaker reaches the other's microphone and the gain goes round. It only
        takes one step of that circle to break it.

    group:
      title: A group strung out along a road, all on one channel
      desc: >-
        Five riders spread over eight kilometres of road. A Bluetooth intercom
        would connect only the two who happen to be close together, breaking the
        group into fragments. Every rider instead holds their own connection to
        the same Mumble server, so the spacing between them carries no meaning
        at all.
      heading: FIVE RIDERS, EIGHT KILOMETRES
      front: front
      back: back
      fuel: stopped for fuel
      intercom_reach: what an intercom would still reach
      server: one channel, one server
      caption: >-
        This is the case the app was built for. A group does not ride in
        formation: somebody stops for fuel, somebody catches a red light,
        somebody is simply faster. On an intercom the group silently breaks into
        fragments that can each hear themselves. On one channel, the spacing
        means nothing.

    tunnel:
      title: What happens when the signal goes
      desc: >-
        A road passing through a tunnel, in three stages. Before it there is
        coverage and the conversation works. Inside there is no data and no
        voice at all — the honest limitation. On the far side the app
        reconnects on its own and plays the backlog off faster than real time
        rather than leaving everybody a second behind.
      # Short on purpose. SVG text does not wrap, so anything that needs a
      # second line needs a split point chosen per language — which is a thing
      # that silently stops being right the moment a word changes. The
      # explanations live in the caption, which is HTML and wraps by itself.
      heading: NO SIGNAL, NO CONVERSATION
      before: coverage
      before_note: the conversation works
      inside: no data
      inside_note: nothing gets through
      after: back on the air
      after_note: reconnects, and catches up
      caption: >-
        This is the defining weakness and no setting fixes it. What the app does
        do is come back on its own and catch up rather than leaving the whole
        group permanently a second behind — but while there is no data there is
        no voice, and that is exactly where an intercom would still be working.

