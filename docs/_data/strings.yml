# Every piece of text the layout and the figures draw, in both languages.
#
# The pages themselves are copies under /ru/ — that was the decision, and it is
# the right one for prose. But the chrome is not prose: the top bar, the hero
# and the labels inside the diagrams appear on every page, and duplicating them
# per page would mean seven places to fix a wording change in each language.
# So the chrome lives here, keyed by language, and `_layouts/default.html`
# reads `site.data.strings[page.lang]`.
#
# Figure text is here for the same reason and one more: an SVG include takes
# `lang=page.lang`, so the diagrams are translated by the same mechanism rather
# than by a second set of copied files.
#
# Adding a language means adding a block here, a set of pages under its own
# prefix, and nothing else. Nothing in the CSS knows a width — the menu
# measures itself — which is what makes a longer language free.

en:
  html_lang: en
  name: English
  code: EN
  flag: /assets/img/flags/us.svg
  # Named as a flag, not as the language: the image is a flag of a country and
  # a screen reader saying "English" over a US flag would be describing
  # something the picture does not show. The link text carries the language.
  flag_alt: ""
  switch_title: Read this page in English

  tagline: Voice for bikers
  description: >-
    A Mumble client built for wind and engine noise inside a helmet.
    Windows, macOS, iOS, iPadOS and Android.

  skip: Skip to content
  menu: Menu
  sections: Sections
  footer_nav: Footer

  hero:
    eyebrow: 'Mumble client · Windows · macOS · iOS · iPadOS · Android'
    title_line1: Talk at speed,
    title_line2: and be understood.
    cta_primary: Set up a server
    cta_primary_url: /server.html
    cta_secondary: Source on GitHub
    note: >-
      The bars above are the app's own analyser: microphone, after suppression,
      and what actually leaves for the server.

  footer:
    blurb: Voice for bikers. Free software, GPL&nbsp;v3.
    source: Source
    mumble: Mumble project
    colophon: >-
      MumbleWay is an independent client for the Mumble protocol. It is not
      affiliated with or endorsed by the Mumble project.

  nav:
    - title: Overview
      url: /index.html
    - title: Settings
      url: /settings.html
    - title: On the road
      url: /scenarios.html
    - title: Your own server
      url: /server.html
    - title: Send a recording
      url: /sending-a-recording.html
    - title: Licences
      url: /licences.html
    - title: Privacy
      url: /privacy.html

  figures:
    range:
      title: Intercom range against an internet channel
      desc: >-
        On the left, a Bluetooth intercom: two riders inside a dashed circle are
        connected, and a third who has fallen behind sits outside it,
        disconnected. On the right, the same three riders at the same distances
        all connect to a Mumble server, and the distances between them no
        longer matter.
      intercom: BLUETOOTH INTERCOM
      intercom_range: a few hundred metres
      out_of_range: out of range
      server: your Mumble server
      internet_range: a hundred metres, or another country
      caption: >-
        An intercom is a radio link between helmets, and it ends where the radio
        does. Putting the channel on a server you control removes distance from
        the problem — and replaces it with needing a signal, which is the trade
        this whole app is.

    timeline:
      title: How voice activation opens and closes the channel
      desc: >-
        Three stacked tracks. The spoken word runs from 200 to 560
        milliseconds. The detector only recognises it from 250 to 520, missing
        the first consonant and dropping before the last. What is transmitted
        runs from 200 to 600: an 80 millisecond look-ahead recovers the opening
        consonant, and a 200 millisecond tail carries the closing one, fading
        over its final 30 milliseconds.
      you_say: You say
      detector: Detector
      transmitted: Transmitted
      detected: speech detected
      on_the_wire: on the wire
      lookahead: 80 ms look-ahead
      tail: 200 ms tail
      fade: 30 ms fade
      caption: >-
        A threshold decides mid-syllable. Holding the audio back by 80 ms lets
        the channel open on the sound that <em>led into</em> the decision, so
        the opening consonant survives; a 200 ms tail carries the closing one,
        fading at the very end so it does not click.

    passenger:
      title: How a rider and passenger build a feedback loop
      desc: >-
        Two helmets a foot apart on the same channel. The passenger's speaker is
        heard by the rider's microphone, which sends it back to the passenger's
        speaker, which the rider's microphone hears again — a loop that climbs
        until it howls. Turning one speaker down breaks it.
      heading: RIDER AND PASSENGER, ONE CHANNEL
      rider: rider
      passenger: passenger
      loop_out: speaker into the other's microphone
      loop_back: and straight back again
      fix_heading: BREAK IT ANYWHERE
      fix1: Turn one speaker volume down.
      fix2: 'Feedback suppression: cut when a howl builds.'
      fix3: Failing that, put the passenger on push to talk.
      fix_note: A loop needs every step. Removing one is enough.
      caption: >-
        Two microphones inside two helmets a foot apart, both on the same
        channel, is the easiest way there is to build a feedback loop — each
        speaker reaches the other's microphone and the gain goes round. It only
        takes one step of that circle to break it.

    group:
      title: A group strung out along a road, all on one channel
      desc: >-
        Five riders spread over eight kilometres of road. A Bluetooth intercom
        would connect only the two who happen to be close together, breaking the
        group into fragments. Every rider instead holds their own connection to
        the same Mumble server, so the spacing between them carries no meaning
        at all.
      heading: FIVE RIDERS, EIGHT KILOMETRES
      front: front
      back: back
      fuel: stopped for fuel
      intercom_reach: what an intercom would still reach
      server: one channel, one server
      caption: >-
        This is the case the app was built for. A group does not ride in
        formation: somebody stops for fuel, somebody catches a red light,
        somebody is simply faster. On an intercom the group silently breaks into
        fragments that can each hear themselves. On one channel, the spacing
        means nothing.

    tunnel:
      title: What happens when the signal goes
      desc: >-
        A road passing through a tunnel, in three stages. Before it there is
        coverage and the conversation works. Inside there is no data and no
        voice at all — the honest limitation. On the far side the app
        reconnects on its own and plays the backlog off faster than real time
        rather than leaving everybody a second behind.
      # Short on purpose. SVG text does not wrap, so anything that needs a
      # second line needs a split point chosen per language — which is a thing
      # that silently stops being right the moment a word changes. The
      # explanations live in the caption, which is HTML and wraps by itself.
      heading: NO SIGNAL, NO CONVERSATION
      before: coverage
      before_note: the conversation works
      inside: no data
      inside_note: nothing gets through
      after: back on the air
      after_note: reconnects, and catches up
      caption: >-
        This is the defining weakness and no setting fixes it. What the app does
        do is come back on its own and catch up rather than leaving the whole
        group permanently a second behind — but while there is no data there is
        no voice, and that is exactly where an intercom would still be working.

ru:
