<!-- The one fault on this page that a diagram explains faster than a paragraph. -->
<figure class="figure">
<svg viewBox="0 0 900 250" role="img" aria-labelledby="pl-title pl-desc" class="fig">
  <title id="pl-title">How a rider and pillion build a feedback loop</title>
  <desc id="pl-desc">Two helmets a foot apart on the same channel. The pillion's
  speaker is heard by the rider's microphone, which sends it back to the
  pillion's speaker, which the rider's microphone hears again — a loop that
  climbs until it howls. Turning one speaker down breaks it.</desc>

  <defs>
    <g id="pl-helmet">
      <g transform="scale(0.115) translate(-108,-236)">
        <path d="M 356 236 C 500 236 622 350 622 492 L 622 606
                 C 622 664 574 706 516 706 L 316 706
                 C 190 706 108 606 108 480 C 108 344 216 236 356 236 Z"
              fill="#E9F0F7"/>
        <path d="M 566 398 L 566 516 L 360 516 C 296 516 262 486 262 458
                 C 262 424 300 398 360 398 Z" fill="#FFA53C"/>
        <path d="M 316 706 C 232 706 166 654 132 578 L 228 546
                 C 252 600 288 626 344 626 L 516 626
                 C 574 626 622 654 622 706 Z" fill="#BCCBD9"/>
      </g>
    </g>
    <marker id="pl-arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF5D5D"/>
    </marker>
  </defs>

  <text x="0" y="18" fill="#8695A6" font-size="14" font-family="inherit"
        letter-spacing="1.5">RIDER AND PILLION, ONE CHANNEL</text>

  <!-- Both helmets, facing the same way, close enough to hear each other. -->
  <use href="#pl-helmet" x="150" y="120"/>
  <use href="#pl-helmet" x="330" y="120"/>
  <text x="180" y="215" fill="#8695A6" font-size="13" font-family="inherit"
        text-anchor="middle">rider</text>
  <text x="360" y="215" fill="#8695A6" font-size="13" font-family="inherit"
        text-anchor="middle">pillion</text>

  <!-- The loop. Two arcs going opposite ways, which is the whole of it: each
       one is somebody's speaker reaching somebody else's microphone. -->
  <g stroke="#FF5D5D" stroke-width="2" fill="none" marker-end="url(#pl-arrow)">
    <path d="M 210 128 Q 285 86 350 128"/>
    <path d="M 350 176 Q 285 218 210 176"/>
  </g>
  <text x="285" y="76" fill="#FF5D5D" font-size="12" font-family="inherit"
        text-anchor="middle">speaker into the other's microphone</text>
  <text x="285" y="240" fill="#FF5D5D" font-size="12" font-family="inherit"
        text-anchor="middle">and straight back again</text>

  <!-- ── The fix ──────────────────────────────────────────────────────── -->
  <line x1="500" y1="30" x2="500" y2="230" stroke="#263140" stroke-width="1"/>

  <text x="540" y="18" fill="#3ECF7E" font-size="14" font-family="inherit"
        letter-spacing="1.5">BREAK IT ANYWHERE</text>

  <g font-size="13" font-family="inherit">
    <circle cx="552" cy="70" r="13" fill="none" stroke="#3ECF7E" stroke-width="1.5"/>
    <text x="552" y="75" fill="#3ECF7E" text-anchor="middle" font-size="12">1</text>
    <text x="578" y="75" fill="#DDE6EF">Turn one speaker volume down.</text>

    <circle cx="552" cy="120" r="13" fill="none" stroke="#3ECF7E" stroke-width="1.5"/>
    <text x="552" y="125" fill="#3ECF7E" text-anchor="middle" font-size="12">2</text>
    <text x="578" y="125" fill="#DDE6EF">Feedback suppression: cut when a howl builds.</text>

    <circle cx="552" cy="170" r="13" fill="none" stroke="#3ECF7E" stroke-width="1.5"/>
    <text x="552" y="175" fill="#3ECF7E" text-anchor="middle" font-size="12">3</text>
    <text x="578" y="175" fill="#DDE6EF">Failing that, put the pillion on push to talk.</text>
  </g>
  <text x="578" y="212" fill="#61707F" font-size="12" font-family="inherit">
    A loop needs every step. Removing one is enough.
  </text>
</svg>
<figcaption>Two microphones inside two helmets a foot apart, both on the same
channel, is the easiest way there is to build a feedback loop — each speaker
reaches the other's microphone and the gain goes round. It only takes one step
of that circle to break it.</figcaption>
</figure>
