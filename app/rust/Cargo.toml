[package]
name = "rust_lib_mumbleway"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"

# The whole client engine lives in the core crate; this crate is only the
# Flutter-facing shim, so the protocol and audio code stays testable on its own.
mumbleway-core = { path = "../../core" }

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
parking_lot = "0.12"
anyhow = "1"
rustls-pemfile = "2"
serde_json = "1.0.151"

# Process CPU and memory now live in `mumbleway_core::usage`, with the
# per-target dependencies they need. They moved there because the relief
# ladder reads the CPU figure, and the ladder has to work whether or not
# anybody has the diagnostics panel open.

# Android only. cpal's backend asks `ndk_context` for the JVM and the app
# Context so it can reach the Java audio APIs, and panics outright if nobody
# has registered them. Nothing does that in a Flutter app — there is no
# `ndk-glue` main here, only a library loaded into someone else's process — so
# the app has to hand them over itself. See `android_context` in api/mumbleway.
[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"

# cpal, with one hunk changed. See third_party/cpal/PATCH.md.
#
# **Declared here as well as in `core/Cargo.toml`, because a `[patch]` only
# applies to the package it is resolved from.** `core` is a path dependency of
# this crate, not a workspace member, so its patch table does not reach here —
# and without this the build fails outright, because the `android-input-preset`
# feature `core` asks for does not exist on the published cpal.
#
# `tools/dfbench` repeats the tract patch for the same reason.
[patch.crates-io]
cpal = { path = "../../third_party/cpal" }

# tract-core, with one hunk changed. See third_party/tract-core/PATCH.md.
#
# **This was missing, and only a `#[cfg(debug_assertions)]` hid it.** The patch
# is what lets the vendored plain DFN3 load at all: tract's `add_const`
# deduplicates constants by value and mints their name without checking it is
# free, so the graph is rejected with `duplicate name /convt3/Conv.bias`. That
# check is a debug assertion, so every release build of this crate has loaded
# the model regardless and nothing has ever gone wrong in the field.
#
# It would have gone wrong the first time anybody built the app in debug and
# reached for the light enhancer model — the rung that keeps a slow phone
# enhancing rather than losing the enhancer — and it would have looked like a
# corrupt download rather than a resolver detail two directories away.
tract-core = { path = "../../third_party/tract-core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Always optimise the native audio dependencies, even in debug builds.
#
# Two reasons, both necessary:
#
# 1. Correctness on Windows. `audiopus_sys` builds libopus with the `cmake`
#    crate, which infers CMAKE_BUILD_TYPE from opt-level: at opt-level 0 it
#    picks Debug, so libopus links the *debug* CRT (/MDd) and pulls in
#    _CrtDbgReportW. Rust's MSVC target always uses the release CRT, so the
#    link fails with unresolved externals. Any non-zero opt-level selects a
#    release-CRT build type and the mismatch disappears.
#
# 2. Realtime headroom. Opus and RNNoise run on every 10 ms block; compiled
#    unoptimised they are far too slow to keep up, so a debug build would
#    glitch constantly even though it "works".
[profile.dev.package.audiopus_sys]
opt-level = 2

[profile.dev.package.opus]
opt-level = 2

[profile.dev.package.nnnoiseless]
opt-level = 2
