      s_limit: "Лимитер"
      s_limit_sub: "всегда последний"
      out: "Остальным"
      out_sub: "Opus, 20 мс"
      i_profile: "Профиль"
      i_profile_sub: "по первой секунде речи"
      i_voice: "Это голос?"
      i_voice_sub: "VAD, высота тона, запас"
      i_took: "Что убрал очиститель"
      i_took_sub: "и в какой полосе"
      i_floor: "Уровень шума, измеряется непрерывно"
      i_floor_sub: "самое тихое за последнее время, а не среднее"
      legend_sound: "звук"
      legend_info: "сведения"
      note_echo: "первым, иначе эхо пройдёт дальше"
      note_limiter: "последним, иначе это не лимитер"
      footnote: "Порядок ступеней взят из кода, а не упрощён для картинки."
      caption: >-
        Каждый отсчёт идёт по зелёному пути и именно в этом порядке. Оранжевые
        блоки никто не слышит: это измерения, снятые с сигнала, которые меняют
        поведение следующих ступеней. Об этом стоит помнить, читая панель
        диагностики: проверка на голос ничего не убирает, она только решает,
        открыть ли гейт.
    conditions:
      title: "Тот же тракт в трёх условиях, ради которых он сделан"
      desc: >-
        Три строки, по одной на условие. Слева то, что слышит микрофон, справа
        то, что получают остальные. На стоянке фон — тонкая полоса, и речь
        проходит почти нетронутой. На скорости ветер даёт толстую полосу,
        которой на переданной стороне уже нет. На светофоре рядом с работающими
        моторами полоса ещё толще, и её тоже нет. Ступени во всех трёх строках
        одинаковы, разный только профиль, выбранный по измеренному отношению
        сигнал/шум.
      heard: "что слышит микрофон"
      sent: "что получают остальные"
      quiet: "Стоя или в помещении"
      quiet_snr: "сигнал/шум выше 35 дБ"
      wind: "Ветер на скорости"
      wind_snr: "от 20 до 35 дБ"
      engine: "Моторы на светофоре"
      engine_snr: "ниже 20 дБ"
      p_light: "Слабое"
      p_standard: "Обычное"
      p_helmet: "Шлем"
      legend_noise: "фон"
      legend_speech: "речь"
      note_same: "Ступени во всех трёх одни и те же. Разный только профиль."
      caption: >-
        Формы здесь условные, а не снятые с реальной записи: в таком
        размере настоящая превратилась бы в серое пятно, а важно тут другое —
        какую полосу тракт убирает, а какую оставляет. «Автоматически»
        выбирает профиль по отношению сигнал/шум в первую секунду после
        открытия гейта и пересматривает выбор, когда фон меняется. Промежутки
        внутри строки — это не закрытая передача: гейт держится открытым ещё
        секунду, и именно поэтому одна фраза не приходит тремя обрывками.
    aec:
      title: "Как работает подавление эха"
      desc: >-
        Сверху шлем: то, что говорят другие, идёт в динамик, а микрофон ловит и
        собственный голос водителя, и звук динамика снова — с задержкой,
        изменённый отражениями. Снизу сам подавитель: копия сыгранного остаётся как
        опорный сигнал, измеряется смещение между ней и эхом, адаптивный фильтр
        строит модель пути, и результат вычитается из сигнала микрофона. То,
        до чего вычитание не дотянулось, подавляется отдельно. ERLE — сколько
        удалось убрать.
      room: "внутри шлема"
      far: "Что говорят другие"
      far_sub: "известно точно"
      speaker: "Динамик"
      mic: "Микрофон"
      near: "Ваш голос"
      echo: "тот же звук снова, с задержкой и окрашенный"
      residual: "Остаточное эхо"
      residual_sub: "подавляется отдельно"
      to_chain: "дальше по тракту"
      reference: "копия — только для вычитания"
      delay: "Где эхо?"
      delay_sub: "смещение измеряют, а не угадывают"
      filter: "Модель пути"
      filter_sub: "подстраивается, пока говорит дальняя сторона"
      estimate: "каким эхо должно быть"
      erle: "ERLE, сколько удалось убрать"
      erle_sub: "видно в «Диагностике»"
      note_delay: >-
        Динамик в шлеме возвращает звук примерно через миллисекунду. Телефон на
        громкой связи — после микшера, ресемплера, буфера и самого железа,
        поэтому смещение измеряют, а не задают заранее.
      note_double: >-
        «Забирать микрофон» отдаёт эту работу ещё и телефону. Два подавителя на
        одно эхо хуже, чем любой из них по отдельности, и увидеть это можно по
        строке «Возврат эха» в диагностике.
      caption: >-
        Всё это работает потому, что один из двух звуков, попадающих в микрофон,
        известен точно: его проиграло само приложение. С ветром такого
        преимущества нет ни у кого — потому остальная часть тракта и устроена
        куда сложнее этой. «Возврат эха» читайте как сравнение между
        настройками, а не как значение относительно порога: оно зависит от
        громкости выхода, а её приложение не знает.
    range:
      title: Дальность интеркома и дальность интернет-канала
      desc: >-
        Слева Bluetooth-интерком: двое внутри пунктирного круга связаны, а
        третий, отставший, оказался за его пределами, и связи с ним нет. Справа
        те же трое на тех же расстояниях подключены к серверу Mumble, и
        расстояния между ними больше ничего не значат.
      intercom: BLUETOOTH-ИНТЕРКОМ
      intercom_range: несколько сотен метров
      out_of_range: вне зоны
      server: ваш сервер Mumble
      internet_range: сто метров или другая страна
      caption: >-
        Интерком — это радиосвязь между шлемами, и она кончается там, где
        кончается радио. Свой сервер убирает из задачи расстояние и взамен
        требует связи. На этом размене построено всё приложение.

    ladder:
      title: Чем жертвует медленное устройство и в каком порядке
      desc: >-
        Восемь ступеней, спускающихся слева направо. Сначала слабеет очиститель
        речи, затем перестаёт выплачиваться упреждение, затем вдвое
        укорачивается фильтр эхоподавителя, затем отключаются три дешёвых
        детектора, затем отрисовка панели диагностики, затем её живые
        индикаторы и полоски, затем берётся более дешёвая модель
        шумоподавления, и в самом конце очиститель выключается совсем.
      enhancer_soft: очиститель слабеет
      paydown: упреждение стоит
      echo_filter: фильтр эха вдвое
      detectors: дешёвые детекторы
      display: отрисовка панели
      dots: индикаторы замирают
      simple_model: модель попроще
      enhancer_off: без очистителя
      first: жертвуют первым
      last: жертвуют последним
      axis: сначала — то, что дешевле по качеству
      caption: >-
        Порядок измерен, а не придуман. Две самые дешёвые по качеству уступки
        дают и самую большую экономию, а то, что стоит дороже всего &mdash;
        очиститель речи, превращающий 1,5&nbsp;дБ разницы в 16&nbsp;дБ,
        &mdash; пробуют последним, а не первым.
    timeline:
      title: Как голосовая активация открывает и закрывает передачу
      desc: >-
        Три дорожки одна над другой. Слово звучит с 200-й по 560-ю миллисекунду.
        Детектор уверен в нём только с 250-й по 520-ю: он теряет первый
        согласный и отпускает раньше последнего. В эфир уходит отрезок с 200-й
        по 720-ю: упреждение в 240 мс возвращает начальный согласный, а секундный
        хвост доносит конечный и перекрывает паузы внутри фразы, затухая на
        последних 30 мс.
      you_say: Вы говорите
      detector: Детектор
      transmitted: В эфир
      detected: речь обнаружена
      on_the_wire: идёт передача
      lookahead: упреждение 240 мс
      tail: хвост 1 с
      fade: затухание 30 мс
      caption: >-
        Порог принимает решение посреди слога. Задержка звука на 240 мс
        позволяет открыть передачу на том звуке, который <em>привёл</em> к
        решению, — и начальный согласный сохраняется; секундный хвост доносит
        конечный и затухает в самом конце, чтобы не щёлкнуло.

    passenger:
      title: Как водитель и пассажир создают петлю обратной связи
      desc: >-
        Два шлема в тридцати сантиметрах друг от друга, в одном канале. Звук
        из динамика пассажира попадает в микрофон водителя, возвращается в
        динамик пассажира, микрофон водителя слышит его снова — и так по кругу,
        пока не начнётся вой. Достаточно убавить один динамик, чтобы разорвать
        этот круг.
      heading: ВОДИТЕЛЬ И ПАССАЖИР, ОДИН КАНАЛ
      rider: водитель
      passenger: пассажир
      loop_out: звук динамика — в чужой микрофон
      loop_back: и сразу обратно
      fix_heading: РАЗОРВАТЬ ГДЕ УГОДНО
      fix1: Убавьте громкость одного динамика.
      # Worded to match the app's own setting, "Обрывать только при нарастании
      # воя", shortened to fit the figure. A diagram that names a control
      # differently from the screen it describes sends the reader looking for
      # something that is not there.
      fix2: 'Подавление гула обратной связи: обрывать при вое.'
      fix3: Не помогло — переведите пассажира на кнопку.
      fix_note: Петле нужны все звенья. Хватит убрать одно.
      caption: >-
        Два микрофона в двух шлемах в тридцати сантиметрах друг от друга, в
        одном канале, — самый простой способ получить петлю обратной связи:
        каждый динамик достаёт до чужого микрофона, и усиление идёт по кругу.
        Чтобы разорвать его, достаточно убрать одно звено.

    group:
      title: Группа, растянувшаяся по дороге, вся в одном канале
      desc: >-
        Пятеро растянулись на восемь километров дороги. Bluetooth-интерком
        связал бы только тех двоих, кто случайно оказался рядом, а остальных
        отрезал. Вместо этого у каждого своё соединение с одним и тем же
        сервером Mumble, и расстояния между ними не значат ровно ничего.
      heading: ПЯТЕРО, ВОСЕМЬ КИЛОМЕТРОВ
      front: голова
      back: хвост
      fuel: встал на заправку
      intercom_reach: докуда достал бы интерком
      server: один канал, один сервер
      caption: >-
        Ради этого случая всё и затевалось. Группа не едет строем: кто-то
        встал на заправку, кто-то попал на красный, кто-то просто едет быстрее.
        На интеркоме она незаметно распадается на компании, и каждая слышит
        только себя. В одном канале расстояния не значат ничего.

    tunnel:
      title: Что происходит, когда пропадает связь
      desc: >-
        Дорога через тоннель, показанная в три этапа. До него связь есть и
        разговор идёт. Внутри нет ни данных, ни голоса — и это честное
        ограничение. На выходе приложение переподключается само и проигрывает
        накопившееся быстрее обычного, а не оставляет всех отставать на
        секунду.
      heading: НЕТ СВЯЗИ — НЕТ РАЗГОВОРА
      before: связь есть
      before_note: разговор идёт
      inside: данных нет
      inside_note: не проходит ничего
      after: снова в эфире
      after_note: переподключается и догоняет
      caption: >-
        Это главная слабость, и никакой настройкой она не лечится. Приложение
        возвращается само и догоняет, а не оставляет всю группу навсегда
        отставать на секунду, — но пока нет данных, нет и голоса, и именно
        здесь интерком продолжал бы работать.
