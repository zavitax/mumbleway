{%- assign f = site.data.strings[include.lang].figures.range -%}
<!-- Why this exists at all, in one picture. -->
<figure class="figure">
<svg viewBox="0 0 900 340" role="img" aria-labelledby="rg-title rg-desc" class="fig">
  <title id="rg-title">{{ f.title }}</title>
  <desc id="rg-desc">{{ f.desc | strip_newlines }}</desc>

  <defs>
    {% include helmet.svg id="rider" scale="0.07" %}
    {% include helmet.svg id="rider-lost" scale="0.07"
       shell="#4A5563" visor="#28313C" chin="#3B4653" %}
    {% include cloud.svg id="rg-cloud" %}
  </defs>

  <!-- ── Left: the intercom ───────────────────────────────────────────── -->
  <text x="0" y="20" fill="#8695A6" font-size="14" font-family="inherit"
        letter-spacing="1.5">{{ f.intercom }}</text>

  <circle cx="150" cy="170" r="105" fill="#3ECF7E" fill-opacity="0.05"
          stroke="#3ECF7E" stroke-opacity="0.45" stroke-width="1.5"
          stroke-dasharray="6 6"/>
  <text x="150" y="292" fill="#61707F" font-size="12" font-family="inherit"
        text-anchor="middle">{{ f.intercom_range }}</text>

  <line x1="120" y1="150" x2="185" y2="195" stroke="#3ECF7E" stroke-width="2"/>
  <use href="#rider" x="86" y="132"/>
  <use href="#rider" x="168" y="182"/>

  <!-- The one who stopped for fuel. -->
  <use href="#rider-lost" x="330" y="96"/>
  <path d="M215 150 L325 118" stroke="#61707F" stroke-width="2"
        stroke-dasharray="5 6"/>
  <path d="M262 126 l16 16 M278 126 l-16 16" stroke="#FF5D5D" stroke-width="2.5"
        stroke-linecap="round"/>
  <text x="300" y="152" fill="#8695A6" font-size="13" font-family="inherit">{{ f.out_of_range }}</text>

  <!-- ── Divider ──────────────────────────────────────────────────────── -->
  <line x1="452" y1="30" x2="452" y2="300" stroke="#263140" stroke-width="1"/>

  <!-- ── Right: the internet channel ──────────────────────────────────── -->
  <text x="490" y="20" fill="#FFA53C" font-size="14" font-family="inherit"
        letter-spacing="1.5">MUMBLEWAY</text>

  <!-- Named before it is drawn. The label sat underneath, which meant the eye
       reached the shape first and had to hold it unexplained until it found
       the words — and the whole claim of this half of the picture is *what*
       the riders are reaching. -->
  <!-- Baseline 75, so the cap-tops land on y=65 — the top of the dashed circle
       opposite (cy 170 less r 105). The two halves are a comparison, and a
       comparison whose sides begin at different heights reads as two drawings
       that happen to share a frame. -->
  <text x="716" y="75" fill="#8695A6" font-size="13" font-family="inherit"
        text-anchor="middle">{{ f.server }}</text>

  <use href="#rg-cloud" x="669" y="82"/>

  <g stroke="#FFA53C" stroke-width="2" fill="none" opacity="0.9">
    <path d="M536 200 Q600 168 700 141"/>
    <path d="M646 236 Q680 192 716 141"/>
    <path d="M812 176 Q782 156 748 141"/>
  </g>

  <use href="#rider" x="502" y="182"/>
  <use href="#rider" x="612" y="218"/>
  <use href="#rider" x="795" y="158"/>

  <text x="686" y="292" fill="#61707F" font-size="12" font-family="inherit"
        text-anchor="middle">{{ f.internet_range }}</text>
</svg>
<figcaption>{{ f.caption | strip_newlines }}</figcaption>
</figure>
