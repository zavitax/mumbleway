<!doctype html>
<!--
  The page an invitation lands on when the app did not take it.

  Deliberately plain HTML with no Jekyll front matter, so it is copied verbatim
  and carries no layout, no navigation and no analytics. An invitation is a
  thing somebody was handed by a friend; it should open, not market.

  **On a phone with MumbleWay installed this page is usually never seen.** The
  https link is registered as an Android App Link, so Android hands it straight
  to the app. This is what happens when it cannot: the app is not installed,
  the link was opened on a desktop, or the Digital Asset Links file stopped
  being served and Android quietly went back to treating it as an ordinary URL.

  **The invitation is in the fragment**, after the `#`. Browsers never send a
  fragment to the server, so the host, the channel and any password stay on
  this device; nothing about who is inviting whom reaches a GitHub log. That is
  also why every bit of the work below is done in the page rather than by
  anything server-side: there is nothing on the server to do it with.
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Add a server &middot; MumbleWay</title>
<style>
  :root { color-scheme: dark light; }
  body {
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 32px 20px; background: #0f1115; color: #e8eaed;
    display: flex; justify-content: center;
    /* Room at the foot for the bars, so the last line of content never sits
       under them however short the page is. */
    min-height: 100vh; box-sizing: border-box; padding-bottom: 190px;
  }
  main { width: 100%; max-width: 30rem; position: relative; z-index: 1; }
  /* Uppercase in the markup rather than by `text-transform`, so the casing is
     in the text itself. The letter-spacing is the part that matters: caps set
     at normal tracking read as shouting rather than as a heading. */
  h1 { font-size: 1.5rem; margin: 0 0 1.5rem; text-align: center; letter-spacing: 0.06em; }

  /* The wordmark, and then a clear gap. The logo is the only thing on this
     page that says which app is asking, so it wants air around it rather than
     to read as the first line of the card. */
  .brand { text-align: center; margin: 8px 0 44px; }
  .brand img { width: 143px; max-width: 45%; height: auto; }

  /* The analyser from the home page's hero, along the foot of the page.
     Fixed rather than in the flow: it belongs to the page, not to the content,
     and on a short page there is nothing below the button to anchor it to.
     `pointer-events: none` so it never swallows a tap meant for the button. */
  #analyser {
    position: fixed; inset: auto 0 0 0;
    width: 100%; height: 160px;
    opacity: 0.34; pointer-events: none; z-index: 0;
    mask-image: linear-gradient(to top, #000 0%, #000 30%, transparent 100%);
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 30%, transparent 100%);
  }
  .card {
    background: #1a1d23; border: 1px solid #2a2e37; border-radius: 12px;
    padding: 20px; margin-bottom: 24px;
  }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; }
  .row dt { color: #9aa0aa; }
  .row dd { margin: 0; text-align: right; word-break: break-all; }
  dl { margin: 0; }
  a.open {
    display: block; text-align: center; text-decoration: none;
    background: #4c8dff; color: #06121f; font-weight: 600; font-size: 1.05rem;
    padding: 16px; border-radius: 10px; margin-bottom: 20px;
  }
  .stores { text-align: center; }
  .stores a { color: #8ab4f8; }
  /* Centred like the link under it, since the two stack and a single short
     line ranged left below a centred one reads as a mistake. `#empty` is left
     ranged left on purpose: it is a sentence to read, not a label. */
  #hint { text-align: center; }
  .muted { color: #9aa0aa; font-size: 0.9rem; }
  code { background: #22262e; padding: 2px 6px; border-radius: 4px; word-break: break-all; }
</style>

<canvas id="analyser" aria-hidden="true"></canvas>

<main>
  <!-- The wordmark goes home, as a site's logo is expected to. It is the same
       destination as the link at the foot; somebody who wants to know what
       this is will reach for one or the other, and both should work. -->
  <p class="brand">
    <a href="../"><img src="../assets/img/mumbleway-wordmark.svg" alt="MumbleWay"
                       width="537" height="256"></a>
  </p>
  <h1 id="heading">ADD A SERVER</h1>
  <div id="detail" class="card" hidden><dl id="rows"></dl></div>
  <a id="open" class="open" hidden>Open in MumbleWay</a>
  <p id="empty" class="muted" hidden>
    This link carries no invitation. Ask whoever sent it for the full link &mdash;
    everything after the <code>#</code> is the part that matters.
  </p>
  <p id="hint" class="muted" hidden>
    Nothing happened? MumbleWay may not be installed yet.
  </p>
  <!-- One link, to the site, rather than a row of store badges. Somebody
       following an invitation already knows what they are being invited to;
       what they need if it does not open is somewhere to find out what this
       is and where to get it, and the home page already answers both. Three
       store links here also meant three URLs to keep correct from a page
       nobody would notice had gone stale. -->
  <p class="muted stores">
    <a id="more" href="../">Learn more about MumbleWay</a>
  </p>
</main>

<script>
(function () {
  // ---- language -------------------------------------------------------
  //
  // **One URL, translated at run time**, unlike the rest of the site, which
  // has a `/ru/` copy of every page. It cannot work that way here: this path
  // is registered with Android as an App Link on the prefix `/mumbleway/join`,
  // and `/mumbleway/ru/join/` would not match it — a Russian reader would get
  // a browser instead of the app, which is the entire thing this page exists
  // to avoid. So the invitation keeps one address and the words move.
  //
  // English is what is in the markup, so a reader with no JavaScript, or with
  // any other language, gets a page that reads correctly rather than a set of
  // empty elements.
  var STRINGS = {
    ru: {
      title: 'Добавить сервер · MumbleWay',
      heading: 'ДОБАВИТЬ СЕРВЕР',
      name: 'Название',
      server: 'Сервер',
      port: 'Порт',
      channel: 'Канал',
      open: 'Открыть в MumbleWay',
      empty: 'Эта ссылка не содержит приглашения. Попросите отправителя прислать её целиком — важна именно часть после «#».',
      hint: 'Ничего не произошло? Возможно, MumbleWay ещё не установлен.',
      more: 'Подробнее о MumbleWay',
      moreHref: '../ru/',
      htmlLang: 'ru',
    },
  };

  // `?lang=` first, so a link can force one and so this is testable without
  // changing a device's settings. Otherwise the browser's ordered preference
  // list, which is the actual answer to "what does this reader read".
  var forced = (location.search.match(/[?&]lang=([a-z-]+)/i) || [])[1];
  var prefs = forced ? [forced]
    : (navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || '']);
  var T = null;
  for (var p = 0; p < prefs.length; p++) {
    // Prefix match: `ru`, `ru-RU` and `ru-BY` are all the same reader here.
    var tag = String(prefs[p]).toLowerCase();
    if (tag === 'ru' || tag.indexOf('ru-') === 0) { T = STRINGS.ru; break; }
    // Stop at the first language that is not Russian: somebody whose first
    // preference is English should get English even if Russian is second.
    if (tag) break;
  }

  function put(id, text) {
    var el = document.getElementById(id);
    if (el) el.textContent = text;
  }

  if (T) {
    document.documentElement.lang = T.htmlLang;
    document.title = T.title;
    put('heading', T.heading);
    put('open', T.open);
    put('empty', T.empty);
    put('hint', T.hint);
    put('more', T.more);
    var more = document.getElementById('more');
    if (more) more.href = T.moreHref;
  }

  // Everything after the first '#'. Not `location.hash.slice(1)` alone,
  // because a mumble:// link may itself contain a '#' in a channel name and
  // splitting on the first one is what keeps the rest intact.
  var raw = location.href.indexOf('#') >= 0
    ? location.href.slice(location.href.indexOf('#') + 1)
    : '';

  // A messenger, a QR reader or a browser may hand it back percent-encoded.
  // Try to decode, but keep the original if that fails or produces nothing
  // useful: a half-decoded link is worse than the one that arrived.
  var link = raw;
  try {
    var decoded = decodeURIComponent(raw);
    if (decoded.toLowerCase().indexOf('mumble:') === 0) link = decoded;
  } catch (e) { /* malformed escapes: keep raw */ }

  if (link.toLowerCase().indexOf('mumble:') !== 0) {
    document.getElementById('empty').hidden = false;
    return;
  }

  // Shown so the reader can see where they are being invited before tapping.
  // **The password is never displayed**, though it may be in the link: it is
  // the server's, shared with everyone who has the invitation, and putting it
  // on screen only helps whoever is standing behind them.
  try {
    var u = new URL(link);
    var rows = [
      [T ? T.server : 'Server', u.hostname],
      [T ? T.port : 'Port', u.port || '64738'],
      [T ? T.channel : 'Channel',
       decodeURIComponent(u.pathname.replace(/^\/+|\/+$/g, '')) || '—'],
    ];
    var title = u.searchParams.get('title');
    if (title) rows.unshift([T ? T.name : 'Name', title]);

    var dl = document.getElementById('rows');
    rows.forEach(function (r) {
      var d = document.createElement('div'); d.className = 'row';
      var dt = document.createElement('dt'); dt.textContent = r[0];
      var dd = document.createElement('dd'); dd.textContent = r[1];
      d.appendChild(dt); d.appendChild(dd); dl.appendChild(d);
    });
    document.getElementById('detail').hidden = false;
  } catch (e) {
    // An unparseable link is still worth offering to the app, which has a
    // better parser than this one and can say what is wrong with it.
  }

  var open = document.getElementById('open');
  open.href = link;
  open.hidden = false;

  // No automatic redirect. A page that navigates to a custom scheme on load
  // gets an error dialog from the browser when nothing handles it, and on iOS
  // it can fire before the reader has seen where they are going. One tap, on
  // purpose, is both clearer and more reliable.
  open.addEventListener('click', function () {
    setTimeout(function () { document.getElementById('hint').hidden = false; }, 1200);
  });
})();
</script>
<!-- The home page's hero animation, unchanged and unforked: the same file,
     drawing the same three traces. It honours prefers-reduced-motion and stops
     itself when the tab is hidden, so nothing here has to. Loaded last and
     deferred, because a page whose whole job is to open an app must not wait on
     decoration to become tappable. -->
<script src="../assets/js/analyser.js" defer></script>
