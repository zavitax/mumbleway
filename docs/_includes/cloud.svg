           C 20 9 32 0 46 0 C 61 0 73 10 75 23
           C 86 24 93 32 93 42 C 93 52 85 59 75 59 Z"
        fill="#141B24" stroke="#FFA53C" stroke-width="1.5"
        stroke-linejoin="round"/>
  <circle cx="47" cy="35" r="4" fill="#3ECF7E"/>
</g>
