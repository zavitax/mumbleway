name: mumbleway
# Not just a comment: msix:create copies this straight into the Store package's
# manifest as the app's Description, so the Flutter template's "A new Flutter
# project." was being shipped to the Microsoft Store as the product's own words.
description: "Voice for motorcyclists. A Mumble client built for wind and engine noise inside a helmet."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  rust_lib_mumbleway:
    path: rust_builder

  # Bridge to the Rust core.
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.0.0
  # Persists saved servers and preferences.
  shared_preferences: ^2.3.0
  # Resolves the writable directory the client identity certificate lives in.
  path_provider: ^2.1.4
  http: ^1.6.0
  # Hands a documentation link to the platform's browser. The app never renders
  # the site itself: an in-app web view would put our chrome around pages that
  # are already a website, and would have to be kept in step with them.
  url_launcher: ^6.3.1
  share_plus: ^13.3.0
  # Packs the diagnostic recordings into one archive before they are shared.
  # Not cosmetic: iOS types a shared item by its extension, and `.s16` is not a
  # type it knows, so the share sheet offers targets that then receive nothing.
  # Already present transitively under `image`; declared because this uses it.
  archive: ^4.0.9
  file_selector: ^1.1.0

  # Renders a server's details as a QR code, and reads one back.
  #
  # Three packages rather than one because no single package covers every
  # platform this app runs on. `qr_flutter` draws, everywhere. `mobile_scanner`
  # reads from a camera, which only phones and tablets have. `zxing2` reads from
  # an image file in pure Dart, which is how macOS and Windows import a code
  # somebody sent them, and it needs `image` to turn a PNG or JPEG into pixels
  # first.
  #
  # This was pinned at 5.2.3 to avoid the iOS 15.5 floor that 6.0 imposed, on
  # the reasoning that a share feature is not worth dropping devices for. Both
  # halves of that were wrong. The floor would have cost no device — iOS 13 and
  # iOS 15 run on exactly the same iPhones, 6s and later, and iOS 16 is where
  # hardware actually falls off — and 7.0 puts the floor back at iOS 12 anyway,
  # below where this project already sits, so the upgrade moves no target at
  # all. Meanwhile the pin held the Android camera at a plugin two majors
  # behind, on a phone where it would not start.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  zxing2: ^0.2.3
  image: ^4.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  # The version and build number, shown at the foot of the settings screen.
  package_info_plus: ^10.2.1
  # Draws the product lockup. The logo is one generated SVG rather than a
  # layout reimplemented in Dart, so the mark in the app bar and the mark on a
  # store page cannot drift apart — see widgets/wordmark.dart.
  flutter_svg: ^2.3.0
  # Runs YAMNet, which says whether the background is loud and structured, so
  # Auto can pick Helmet on evidence rather than on a level threshold. See
  # services/background_classifier.dart for why it is phones only.
  tflite_flutter: ^0.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The encoder underneath qr_flutter, used directly by the codec test to draw
  # a code without needing a Flutter binding or a golden file.
  qr: ^3.0.2

  # Both are already here transitively, under path_provider. Declared because
  # the screenshot harness imports them directly, to stand a fake in for the
  # real path provider: on Windows that plugin is Dart-and-FFI rather than a
  # method channel, so it cannot be mocked at the channel and instead never
  # answers under the test binding, hanging the run until it times out.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

  # flutter_rust_bridge generates freezed unions for data-carrying enums.
  freezed: ^3.0.0
  build_runner: ^2.4.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

# Windows packaging, after a Windows release build:
#   dart run msix:create --build-windows false --install-certificate false
# (without that last flag the tool stops on an interactive prompt).
#
# These defaults produce a test-signed package for sideloading, which is what a
# developer without a store account can actually install and run. A store
# submission needs the identity and publisher strings Partner Center reserves,
# which are account-specific and cannot be guessed, so the publish workflow
# passes them in from secrets rather than hard-coding placeholders here that
# would yield a package Partner Center silently rejects. See docs/RELEASING.md.
msix_config:
  display_name: MumbleWay
  publisher_display_name: MumbleWay
  identity_name: com.mumbleway.mumbleway
  # The default for a local build only. Every CI package overrides it with
  # --version, deriving major.minor from `version:` above and taking the third
  # component from the run number, because the Store rejects a submission whose
  # version is not higher than the last one. Do not raise this by hand
  # expecting it to affect a release; it will not. See docs/RELEASING.md.
  msix_version: 1.0.0.0
  logo_path: assets/icon/mumbleway.png
  capabilities: microphone, internetClient, internetClientServer, privateNetworkClientServer

# App icon generation. Regenerate after changing assets/icon/*.svg with:
#   rsvg-convert -w 1024 -h 1024 -o assets/icon/mumbleway.png assets/icon/mumbleway.svg
#   dart run flutter_launcher_icons
#   python ../tool/make_ico.py <tmpdir> windows/runner/resources/app_icon.ico
flutter_launcher_icons:
  image_path: "assets/icon/mumbleway.png"
  android: true
  ios: true
  # Windows is built by tool/make_ico.py instead. This package writes a single
  # 256px PNG-compressed entry, which Windows has to downscale for the 16px
  # title bar and 32px taskbar, and which some shell paths skip entirely in
  # favour of the generic executable glyph. The script emits real BMP entries
  # at 16/24/32/48/64 alongside the PNG ones, so leaving this enabled would
  # overwrite the better icon with the worse one.
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/icon/mumbleway.png"
  remove_alpha_ios: true
  # Launchers crop adaptive icons to their own shape, so the foreground is the
  # padded variant and the background is a flat colour from the app's palette.
  adaptive_icon_background: "#101822"
  adaptive_icon_foreground: "assets/icon/mumbleway_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the .arb catalogues.
  generate: true

  assets:
    - assets/icon/
    - assets/flags/
    # Generated by tool/make_logo.py — do not edit the SVGs by hand.
    - assets/logo/
    # YAMNet, 4 MB. Only ever loaded on Android and iOS -- see
    # services/background_classifier.dart for why not on desktop.
    - assets/models/

  # Exo 2, used for the product name only — see widgets/app_bar_title.dart.
  #
  # One variable file rather than a weight per file: the whole family is 300 kB
  # this way, against roughly that per static instance, and the wordmark wants a
  # weight (600) that is not one of the ones a static set would ship.
  #
  # SIL Open Font License 1.1, kept beside it as Exo2-OFL.txt. The licence
  # requires the copy to travel with the font, which is why it is an asset and
  # not a line in a credits screen nobody reads.
  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
