name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

  # libopus declares cmake_minimum_required below 3.5 and CMake 4 removed that
  # compatibility. .cargo/config.toml sets this too, for local builds, but cargo
  # finds that file by walking up from the *working directory* -- and the Xcode
  # script phase that cargokit runs for iOS executes from DerivedData, outside
  # the repository, so the file is never seen. Setting it here puts it in the
  # environment, which every nested process inherits regardless.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  # Deliberately no global RUSTFLAGS=-D warnings: that applies to dependencies
  # as well, so an upstream crate's warning would break our build. Warnings are
  # denied for our own code through clippy instead.

jobs:
  # ---------------------------------------------------------------------------
  # Engine and UI tests. Runs first and gates the platform builds.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'core -> target'

      # prost-build shells out to protoc; cpal needs the ALSA headers on Linux.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check formatting
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      # The hardware tests are #[ignore]d and stay excluded: CI runners have no
      # audio devices, so they would fail for reasons unrelated to the code.
      - name: Engine tests
        working-directory: core
        run: cargo test --lib

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Dart dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

  # ---------------------------------------------------------------------------
  # Windows desktop
  # ---------------------------------------------------------------------------
  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # libopus is built from source by audiopus_sys via CMake. That CMake runs
      # inside MSBuild, whose Visual Studio generator breaks there, so cargokit
      # forces the Ninja generator on Windows -- which means ninja must be on
      # PATH. See rust_builder/cargokit/cmake/cargokit.cmake.
      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # The Ninja generator, unlike the Visual Studio one, expects cl.exe and
      # the INCLUDE/LIB variables to already be in the environment.
      - uses: ilammy/msvc-dev-cmd@v1

      # Build the engine on its own first. `flutter build windows` runs cargo
      # through MSBuild, which swallows its output and reports only
      # "exited with code -1" -- useless for diagnosing a native build. This
      # step fails fast with the real compiler error instead.
      - name: Build engine
        working-directory: app/rust
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        working-directory: app/build/windows/x64/runner/Release
        run: 7z a -tzip ../../../../../../mumbleway-windows-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-x64
          path: mumbleway-windows-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS desktop
  # ---------------------------------------------------------------------------
  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Xcode hides the cargo output behind its own build phase, so compile the
      # engine separately first to get a readable error if it breaks.
      - name: Build engine
        working-directory: app/rust
        env:
          # Match the Xcode project so libopus's C objects and the Rust code
          # target the same OS version.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package
        working-directory: app/build/macos/Build/Products/Release
        run: ditto -c -k --sequesterRsrc --keepParent mumbleway.app "$GITHUB_WORKSPACE/mumbleway-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-macos
          path: mumbleway-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS and iPadOS (one universal build; unsigned, as CI has no signing identity)
  # ---------------------------------------------------------------------------
  ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Compile-check the engine for the device target first. Flutter reports
      # any Xcode failure as "requires a selected Development Team", which is a
      # guess and hides the real cause; this surfaces it directly.
      #
      # `check` rather than `build`: it still runs the build scripts, so a
      # broken libopus compile is caught, but it does not link. A full `cargo
      # build` also links the cdylib, which the real build never does -- for
      # iOS, cargokit produces a static library that Xcode links, and Xcode is
      # what supplies libclang_rt (without it, libopus's stack probes leave
      # ___chkstk_darwin undefined).
      - name: Compile-check engine for aarch64-apple-ios
        working-directory: app/rust
        env:
          # Match the Xcode project, so libopus's C objects and the Rust code
          # agree. Left unset, the C build follows the SDK (26.5) while Rust
          # targets 10.0, and the linker complains the objects are too new.
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          rustup target add aarch64-apple-ios
          cargo check --release --target aarch64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Unsigned: installing this on a device requires re-signing with your own
      # provisioning profile. It proves the target compiles and links.
      # --verbose is deliberate. Flutter reports every iOS build failure as
      # "requires a selected Development Team" and otherwise swallows
      # xcodebuild's output entirely, leaving nothing to diagnose. The extra
      # log volume is worth being able to see the actual error.
      - name: Build (unsigned)
        working-directory: app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          flutter pub get
          if ! flutter build ios --release --no-codesign --verbose > /tmp/ios-build.log 2>&1; then
            # cargokit relays cargo's stderr line by line prefixed with SEVERE:,
            # and that output is long, so anchoring on a fixed number of context
            # lines misses the error. Match the error text itself, then show the
            # tail of the cargokit block where cargo's real failure lands.
            echo "===== errors ====="
            grep -nE "error\[|error:|panicked|could not compile|Compatibility with CMake|Undefined symbols|ld: |clang: error|fatal error" \
              /tmp/ios-build.log | grep -viE "warning" | head -50
            echo "===== end of cargokit output ====="
            awk '/Cargokit BuildTool failed/,0' /tmp/ios-build.log | tail -70
            echo "===== last 40 lines ====="
            tail -40 /tmp/ios-build.log
            exit 1
          fi

      - name: Package
        working-directory: app/build/ios/iphoneos
        run: ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/mumbleway-ios-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-ios-unsigned
          path: mumbleway-ios-unsigned.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android phones and tablets
  # ---------------------------------------------------------------------------
  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # cargokit cross-compiles the engine for each ABI, so those Rust targets
      # must exist before Gradle runs.
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build App Bundle
        working-directory: app
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Publish a GitHub release when a v* tag is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, ios, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.apk' -o -name '*.aab' \) \
            -exec cp {} release/ \;
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          body: |
            Desktop and mobile builds of MumbleWay.

            The iOS build is **unsigned** — re-sign it with your own provisioning
            profile before installing on a device.
