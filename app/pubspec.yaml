name: mumbleway
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.12.2

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  rust_lib_mumbleway:
    path: rust_builder

  # Bridge to the Rust core.
  flutter_rust_bridge: 2.12.0
  freezed_annotation: ^3.0.0
  # Persists saved servers and preferences.
  shared_preferences: ^2.3.0
  # Resolves the writable directory the client identity certificate lives in.
  path_provider: ^2.1.4
  http: ^1.6.0
  share_plus: ^13.3.0
  file_selector: ^1.1.0

  # Renders a server's details as a QR code, and reads one back.
  #
  # Three packages rather than one because no single package covers every
  # platform this app runs on. `qr_flutter` draws, everywhere. `mobile_scanner`
  # reads from a camera, which only phones and tablets have — held at version 5
  # deliberately: 6 and later require iOS 15.5, and adding a share feature is
  # not a reason to drop every device below it. `zxing2` reads from an image
  # file in pure Dart, which is how macOS and Windows import a code somebody
  # sent them, and it needs `image` to turn a PNG or JPEG into pixels first.
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  zxing2: ^0.2.3
  image: ^4.3.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The encoder underneath qr_flutter, used directly by the codec test to draw
  # a code without needing a Flutter binding or a golden file.
  qr: ^3.0.2

  # flutter_rust_bridge generates freezed unions for data-carrying enums.
  freezed: ^3.0.0
  build_runner: ^2.4.0

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.18.0

# Windows packaging, after a Windows release build:
#   dart run msix:create --build-windows false --install-certificate false
# (without that last flag the tool stops on an interactive prompt).
#
# These defaults produce a test-signed package for sideloading, which is what a
# developer without a store account can actually install and run. A store
# submission needs the identity and publisher strings Partner Center reserves,
# which are account-specific and cannot be guessed, so the publish workflow
# passes them in from secrets rather than hard-coding placeholders here that
# would yield a package Partner Center silently rejects. See docs/RELEASING.md.
msix_config:
  display_name: MumbleWay
  publisher_display_name: MumbleWay
  identity_name: com.mumbleway.mumbleway
  msix_version: 1.0.0.0
  logo_path: assets/icon/mumbleway.png
  capabilities: microphone, internetClient, internetClientServer, privateNetworkClientServer

# App icon generation. Regenerate after changing assets/icon/*.svg with:
#   rsvg-convert -w 1024 -h 1024 -o assets/icon/mumbleway.png assets/icon/mumbleway.svg
#   dart run flutter_launcher_icons
#   python ../tool/make_ico.py <tmpdir> windows/runner/resources/app_icon.ico
flutter_launcher_icons:
  image_path: "assets/icon/mumbleway.png"
  android: true
  ios: true
  # Windows is built by tool/make_ico.py instead. This package writes a single
  # 256px PNG-compressed entry, which Windows has to downscale for the 16px
  # title bar and 32px taskbar, and which some shell paths skip entirely in
  # favour of the generic executable glyph. The script emits real BMP entries
  # at 16/24/32/48/64 alongside the PNG ones, so leaving this enabled would
  # overwrite the better icon with the worse one.
  windows:
    generate: false
  macos:
    generate: true
    image_path: "assets/icon/mumbleway.png"
  remove_alpha_ios: true
  # Launchers crop adaptive icons to their own shape, so the foreground is the
  # padded variant and the background is a flat colour from the app's palette.
  adaptive_icon_background: "#101822"
  adaptive_icon_foreground: "assets/icon/mumbleway_foreground.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the .arb catalogues.
  generate: true

  assets:
    - assets/icon/
    - assets/flags/

  # Exo 2, used for the product name only — see widgets/app_bar_title.dart.
  #
  # One variable file rather than a weight per file: the whole family is 300 kB
  # this way, against roughly that per static instance, and the wordmark wants a
  # weight (600) that is not one of the ones a static set would ship.
  #
  # SIL Open Font License 1.1, kept beside it as Exo2-OFL.txt. The licence
  # requires the copy to travel with the font, which is why it is an asset and
  # not a line in a credits screen nobody reads.
  fonts:
    - family: Exo2
      fonts:
        - asset: assets/fonts/Exo2-Variable.ttf

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
