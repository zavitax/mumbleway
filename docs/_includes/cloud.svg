{%- comment -%}
The server, as a reusable <defs> symbol, drawn from its own origin so a
<use> places its top-left corner. 93 wide, 59 tall.

A cloud rather than a rack unit. The box it replaced read as hardware in a data
centre, which is the opposite of what is true: it is a Raspberry Pi on
somebody's shelf or the smallest VPS anybody sells, and the thing that matters
about it is that it is reachable from anywhere, not what it looks like.

The green dot is the same light the app shows when it is connected.

  id — the id to reference with <use href="#…">, unique within the page
{%- endcomment -%}
<g id="{{ include.id }}">
