name: publish

# Store submissions. Separate from `build` on purpose: that runs on every push
# and must stay fast and side-effect free, while this uploads to real stores.
#
# Every job is gated on its own secrets and skips cleanly when they are absent,
# so this is safe to have in the repository before any store account exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        required: false
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      # Off by default, and that is the whole design of it.
      #
      # Every run of this workflow builds an MSIX, and most runs are an internal
      # Android release nobody wants certified. A Store submission is not like a
      # Play internal upload: certification takes hours to days, each submission
      # supersedes the one before it, and a submission in flight blocks the next
      # one. Submitting on every publish would mean the Store forever trails
      # whatever was last pushed and never finishes a review.
      #
      # So it is asked for, or it is a tag. Both mean somebody decided this
      # build is a release.
      microsoft_store:
        description: 'Also submit the MSIX to the Microsoft Store'
        required: false
        default: false
        type: boolean

env:
  FLUTTER_VERSION: '3.44.8'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  # ---------------------------------------------------------------------------
  # What this build calls itself.
  #
  # A tag is `vMAJOR.MINOR` and the version is `MAJOR.MINOR.RUN_NUMBER`. The
  # third component is not chosen and cannot be: every store rejects a build
  # number it has already seen, *after* the upload rather than before, so it has
  # to rise on its own. `run_number` only ever goes up.
  #
  # Off a tag there is nothing to take a major and minor from, so the version in
  # pubspec.yaml stays the human-facing one and only the build number moves.
  # That keeps an ordinary `-f track=internal` publish exactly as it was.
  # ---------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.v.outputs.tagged }}
      full: ${{ steps.v.outputs.full }}
      build: ${{ github.run_number }}
    steps:
      - id: v
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/v}"
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag v$tag is not vMAJOR.MINOR. The third component
                is the run number and must not be in the tag."
              exit 1
            fi
            echo "tagged=true" >> "$GITHUB_OUTPUT"
            echo "full=${tag}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "::notice::Building $tag.${{ github.run_number }}"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "full=" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Google Play — signed App Bundle to the internal track
  # ---------------------------------------------------------------------------
  google-play:
    name: Google Play
    needs: version
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing material
        id: gate
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::notice::ANDROID_KEYSTORE is not set - skipping Play upload."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
      - uses: arduino/setup-protoc@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.ready == 'true'

      - name: Add Android Rust targets
        if: steps.gate.outputs.ready == 'true'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Written to disk only inside the runner, and only for this job. Gradle
      # reads it through key.properties; nothing lands in the repository.
      - name: Restore the upload key
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > app/android/upload-keystore.jks

          # The keystore is a file; the passwords are not written down at all.
          # They reach Gradle through the environment on the build step below,
          # because a heredoc expands `$` and a backtick, and a .properties
          # file then treats `\` as an escape — so a password containing any
          # of the three arrives as something else, and is reported as wrong
          # when it was right everywhere anybody typed it.

      # Named, before nine minutes of Rust build ends in a null pointer.
      # bundletool reports a missing alias or password as
      # "java.lang.NullPointerException (no error message)", which says
      # nothing about which of the three it wanted.
      - name: Check the signing secrets are all present
        if: steps.gate.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets not set:$missing"
            exit 1
          fi
          # The alias has to exist in the keystore as well as in the secrets.
          keytool -list -keystore app/android/upload-keystore.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" > /dev/null             || { echo "::error::ANDROID_KEY_ALIAS names no key in the keystore. Aliases it does hold:";                  keytool -list -keystore app/android/upload-keystore.jks                    -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -i "alias name" || true;                  exit 1; }
          echo "signing secrets present, alias found"

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          flutter pub get
          # The build number has to rise with every upload: App Store Connect
          # and Play both reject one they have seen before, and a rejection
          # arrives after the build, not before it. run_number only ever goes
          # up, which is the whole requirement — the version in pubspec.yaml
          # stays the human-facing one.
          flutter build appbundle --release \
            --build-number=${{ github.run_number }} \
            ${{ needs.version.outputs.full && format('--build-name={0}', needs.version.outputs.full) || '' }}

      - name: Upload to Play
        if: steps.gate.outputs.ready == 'true' && env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mumbleway.mumbleway
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          # Live on the internal track, draft everywhere else.
          #
          # Internal testing reaches only people who have been named in the
          # console by hand, and the whole point of it is a short loop: a fix
          # goes out, somebody rides with it, they say whether it worked. A
          # draft sitting in the console waiting to be promoted breaks that
          # loop at the least useful moment, and every build in this project so
          # far has needed a human to go and click a button that has never once
          # been used to reject anything.
          #
          # Every wider track still stops for a person. Alpha, beta and
          # production reach people who did not opt into a test build, and a
          # release that goes live because a workflow ran is exactly the sort
          # of thing that should not.
          status: ${{ (inputs.track || 'internal') == 'internal' && 'completed' || 'draft' }}

      - name: Remove signing material
        if: always() && steps.gate.outputs.ready == 'true'
        run: rm -f app/android/upload-keystore.jks app/android/key.properties

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mumbleway-play-bundle
          path: app/build/app/outputs/bundle/release/*.aab

  # ---------------------------------------------------------------------------
  # App Store Connect — signed build to TestFlight
  # ---------------------------------------------------------------------------
  testflight:
    name: TestFlight
    # Required, not decorative. Without it `needs.version.outputs.full` is empty
    # rather than an error, so `--build-name` would be silently dropped and the
    # tagged build would upload under whatever pubspec says — which looks like
    # a working release right up until the version is read.
    needs: version
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing material
        id: gate
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::notice::APPLE_CERTIFICATE_P12 is not set - skipping TestFlight upload."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
      - uses: arduino/setup-protoc@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Imports into a temporary keychain that is discarded with the runner, so
      # the certificate never persists anywhere.
      - name: Import signing certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.mobileprovision

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The checked-in plist carries a placeholder rather than a real team id,
      # so the repository holds no account identifiers. The same goes for the
      # Xcode project: the team is injected into the release config here rather
      # than committed, and without it the archive fails outright with
      # "Signing for Runner requires a development team".
      - name: Point the release build at the distribution profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c \
            "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" app/ios/ExportOptions.plist

          profile=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$profile" > /tmp/pp.plist
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/pp.plist)

          # The export step needs the same profile named explicitly. Left on
          # automatic it asks Xcode to look one up through a signed-in account,
          # which a runner does not have, and fails with "No Accounts" after
          # the archive has already signed correctly.
          /usr/libexec/PlistBuddy -c \
            "Set :provisioningProfiles:com.mumbleway.mumbleway $uuid" \
            app/ios/ExportOptions.plist

          # Manual signing, pinned to the profile that was actually installed.
          # Automatic signing goes looking for a *development* profile it can
          # ask Apple to create, which a runner cannot do and which is not what
          # a store build wants anyway.
          cat >> app/ios/Flutter/Release.xcconfig <<EOF
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$uuid
          EOF

          # The Runner target pins a developer identity for the device SDK, and
          # a target build setting beats an xcconfig, so this one has to be
          # rewritten in place rather than overridden.
          sed -i '' \
            's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/g' \
            app/ios/Runner.xcodeproj/project.pbxproj

          echo "signing with profile $uuid"

      - name: Show the installed signing identities
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "--- identities ---"
          security find-identity -v -p codesigning | sed 's/([0-9A-F]\{40\})/(...)/'
          echo "--- profiles ---"
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -e "$p" ] || continue
            security cms -D -i "$p" > /tmp/pp.plist 2>/dev/null || continue
            printf '%s: app-id=%s expires=%s\n' \
              "$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/pp.plist)" \
              "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/pp.plist)" \
              "$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/pp.plist)"
          done

      - name: Build signed IPA
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          flutter pub get
          # The build number has to rise with every upload: App Store Connect
          # and Play both reject one they have seen before, and the rejection
          # arrives after the build rather than before it. run_number only ever
          # goes up, which is the whole requirement — the version in
          # pubspec.yaml stays the human-facing one.
          flutter build ipa --release \
            --build-number=${{ github.run_number }} \
            ${{ needs.version.outputs.full && format('--build-name={0}', needs.version.outputs.full) || '' }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: app/build/ios/ipa/mumbleway.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      # Housekeeping, so it must not turn a successful publish into a failed
      # run: the build is already uploaded by this point, and a red job would
      # say otherwise. The step still goes red on its own, which is where the
      # reason will be.
      #
      # `success()` is spelled out rather than left implicit. GitHub applies it
      # to any `if` that does not mention status, so this reads the same either
      # way today — but the property it protects is not decorative: expiring
      # every older build after an upload that did not happen leaves testers
      # with nothing installable at all. Written down so that adding
      # `always()` here later has to be a decision rather than an accident.
      - name: Expire superseded TestFlight builds
        if: success() && steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUNDLE_ID: com.mumbleway.mumbleway
          # Only builds numbered below this one are touched, so it does not
          # matter that the upload above is still processing and invisible.
          CURRENT_BUILD: ${{ github.run_number }}
        run: ruby .github/scripts/expire-testflight-builds.rb

      # Kept even when the upload fails: a build that archived and exported
      # correctly is worth having in hand, and losing it because App Store
      # Connect rejected the credentials wastes twenty minutes to learn nothing.
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: mumbleway-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Microsoft Store — MSIX package
  # ---------------------------------------------------------------------------
  # Builds the package always, and submits it when asked. The submission needs a
  # Microsoft Entra application tied to the store account, so both halves are
  # gated on their own secrets and skip cleanly without them — the artifact is
  # still attached to the run, and dragging it into Partner Center by hand
  # remains a working route.
  msix:
    name: Windows MSIX
    runs-on: windows-latest
    env:
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
      # Not a secret in any real sense — the product ID is in the Store
      # listing's own URL — but it is an account identifier and this repository
      # is public, so it comes from the same place the rest of them do.
      STORE_PRODUCT_ID: ${{ secrets.MSIX_STORE_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      # The version has to rise on its own, exactly as the build number does on
      # the other three platforms. Partner Center rejects a submission whose
      # version is not higher than the last accepted one, and it rejects it
      # *after* the upload, so a package pinned to one version means every
      # submission after the first fails for a reason that is nowhere in this
      # repository.
      #
      # MSIX has no separate build-number field, so the four-part version is
      # the whole of it, and the Store reserves the fourth part: it must be 0.
      # That leaves three, and the run number takes the third. Major and minor
      # come from pubspec.yaml so that a deliberate 1.0 -> 1.1 still reads as
      # one, and the ordering survives it: run_number only ever goes up, so
      # the version only ever goes up as long as major.minor never goes down.
      #
      # The patch component of the pubspec version is not carried across.
      # Something had to give with only three usable fields, and a monotonic
      # counter is the one the Store actually requires.
      - name: Work out the package version
        id: version
        shell: pwsh
        working-directory: app
        run: |
          $found = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)\.' |
                   Select-Object -First 1
          if (-not $found) {
            Write-Output "::error::No 'version:' line in app/pubspec.yaml to take major.minor from."
            exit 1
          }
          $major = [int]$found.Matches[0].Groups[1].Value
          $minor = [int]$found.Matches[0].Groups[2].Value
          $build = [int]'${{ github.run_number }}'

          # Checked here rather than discovered by Partner Center twenty minutes
          # later, in the same spirit as the Android signing check above. The
          # first of these is not hypothetical: any pre-1.0 version in
          # pubspec.yaml produces a leading zero, and the Store refuses it.
          if ($major -lt 1) {
            Write-Output "::error::MSIX versions cannot start with 0, and app/pubspec.yaml is at $major.$minor. The Store needs a 1.0 or later."
            exit 1
          }
          foreach ($part in @($minor, $build)) {
            if ($part -gt 65535) {
              Write-Output "::error::MSIX version components must be 0-65535; got $part."
              exit 1
            }
          }

          $version = "$major.$minor.$build.0"
          "MSIX_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "packaging as $version"

      # Two different artifacts, and the difference matters. A store package is
      # unsigned here because Partner Center re-signs it, so it cannot be
      # installed locally; the sideload package is test-signed and can. Which
      # one gets built depends on whether the store identity is configured.
      #
      # --version overrides msix_version in pubspec.yaml, which stays at 1.0.0.0
      # as the default for a local build by hand.
      # --output-name earns its place. Both of these used to be written as
      # `mumbleway.msix`, which is also what a local `dart run msix:create`
      # leaves in the same folder -- and a Store upload was rejected for a
      # PublisherDisplayName of "MumbleWay" because the file picked up was a
      # developer's local build, not this one. The two are now impossible to
      # confuse in a downloads folder.
      - name: Package for the Store
        if: env.MSIX_PUBLISHER != ''
        working-directory: app
        run: >
          dart run msix:create --build-windows false --store
          --version "${{ env.MSIX_VERSION }}"
          --output-name "mumbleway-store-${{ env.MSIX_VERSION }}"
          --publisher "${{ secrets.MSIX_PUBLISHER }}"
          --identity-name "${{ secrets.MSIX_IDENTITY_NAME }}"
          --publisher-display-name "${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}"

      - name: Package for sideloading
        if: env.MSIX_PUBLISHER == ''
        working-directory: app
        run: |
          echo "::notice::MSIX_PUBLISHER is not set - building a test-signed sideload package instead of a Store package."
          dart run msix:create --build-windows false --install-certificate false --version "${{ env.MSIX_VERSION }}" --output-name "mumbleway-sideload-${{ env.MSIX_VERSION }}"

      # Names the identity that is actually inside the package, so a mismatch
      # with Partner Center is a line in this log rather than a rejection after
      # the upload. The publisher is a CN= GUID and the display name is a real
      # person's name, so neither is printed -- only whether they are the
      # defaults that would be wrong.
      - name: Say what is in the package
        if: always() && env.MSIX_PUBLISHER != ''
        working-directory: app
        shell: pwsh
        run: |
          $msix = Get-ChildItem build/windows/x64/runner/Release/*.msix | Select-Object -First 1
          if (-not $msix) { Write-Output "::warning::no .msix was produced"; exit 0 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $entry = $zip.GetEntry('AppxManifest.xml')
            $reader = New-Object System.IO.StreamReader($entry.Open())
            $xml = [xml]$reader.ReadToEnd()
          } finally { $zip.Dispose() }
          $identity = $xml.Package.Identity
          $props = $xml.Package.Properties
          Write-Output "file    : $($msix.Name) ($([math]::Round($msix.Length/1MB,1)) MB)"
          Write-Output "version : $($identity.Version)"
          Write-Output "arch    : $($identity.ProcessorArchitecture)"
          if ($props.PublisherDisplayName -eq 'MumbleWay') {
            Write-Output "::error::PublisherDisplayName is still the pubspec default. Partner Center will reject this: it must match the publisher display name on the account."
            exit 1
          }
          if ($identity.Publisher -like '*Msix Testing*') {
            Write-Output "::error::Publisher is the msix test certificate default, not the one Partner Center reserved."
            exit 1
          }
          Write-Output "publisher/display name: set from secrets, not the defaults"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-msix
          path: app/build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

      # -----------------------------------------------------------------------
      # Partner Center submission
      # -----------------------------------------------------------------------
      # The artifact above is uploaded first and unconditionally, so a failed
      # submission still leaves a package somebody can put in by hand. That is
      # the same order the other store jobs use and it matters more here: the
      # Store is the one that can refuse for reasons a build cannot predict.
      #
      # Three conditions, all of them deliberate:
      #
      #   * `STORE_PRODUCT_ID != ''` keeps this repository buildable by anyone
      #     without a Partner Center account, the same gate the packaging step
      #     uses on MSIX_PUBLISHER.
      #   * asked for, or a tag — see the `microsoft_store` input above.
      #   * `MSIX_PUBLISHER != ''`, because a sideload package is test-signed
      #     with the wrong identity and Partner Center would reject it after
      #     the upload rather than before.
      #
      # **This publishes updates only.** The Store API cannot create a product,
      # so the app has to exist and be live first — which it now is. Note also
      # that Microsoft supports this route for *free* products only; MumbleWay
      # is free, and a paid tier would mean going back to the manual form.
      # Half-configured must not look like unconfigured.
      #
      # The submission is gated on the product ID, so a repository with none of
      # these secrets skips it in silence, which is right. But somebody who has
      # just registered an Entra application and set three of the five gets the
      # same silence, and a run that says nothing is indistinguishable from a
      # run that worked. That happened on the first attempt here.
      #
      # A warning rather than an error: having none of them is legitimate, and
      # having some of them is almost certainly a half-finished setup.
      - name: Check the submission secrets
        if: env.MSIX_PUBLISHER != '' && (github.event_name == 'push' || inputs.microsoft_store)
        shell: pwsh
        env:
          TENANT: ${{ secrets.AZURE_AD_TENANT_ID }}
          CLIENT: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER: ${{ secrets.MSIX_SELLER_ID }}
        run: |
          # Names only. None of the values is printed, and the check is
          # emptiness rather than shape.
          $needed = [ordered]@{
            'AZURE_AD_TENANT_ID'             = $env:TENANT
            'AZURE_AD_APPLICATION_CLIENT_ID' = $env:CLIENT
            'AZURE_AD_APPLICATION_SECRET'    = $env:SECRET
            'MSIX_SELLER_ID'                 = $env:SELLER
            'MSIX_STORE_PRODUCT_ID'          = $env:STORE_PRODUCT_ID
          }
          $missing = @($needed.Keys | Where-Object { [string]::IsNullOrWhiteSpace($needed[$_]) })
          if ($missing.Count -eq 0) {
            Write-Output "all five submission secrets are set"
          } elseif ($missing.Count -eq $needed.Count) {
            Write-Output "::notice::No Store submission secrets are set - building the package only. See docs/RELEASING.md section 4f."
          } else {
            Write-Output "::warning::Store submission is half configured and will be skipped. Missing: $($missing -join ', '). See docs/RELEASING.md section 4f."
          }

          # The seller ID is a number, and the CLI parses it as one.
          #
          # `msstore reconfigure` answers a non-numeric seller ID with an
          # unhandled `System.FormatException` out of `RetrieveSellerId`, and
          # because the value is masked in the log the exception reads
          # `The input string '***' was not in a correct format` -- which names
          # neither the setting nor the problem. That cost the first attempt.
          #
          # Partner Center invites it, too. The Seller ID is under *Legal info*
          # and nowhere near the *Identifiers* page that Microsoft's own setup
          # doc points at -- and Identifiers does hold a Publisher ID, which
          # looks like a plausible answer and is not numeric.
          if ($missing -notcontains 'MSIX_SELLER_ID' -and $env:SELLER.Trim() -notmatch '^\d+$') {
            # No backticks in the message: this is a double-quoted PowerShell
            # string, where a backtick is the escape character and would be
            # eaten silently.
            Write-Output "::error::MSIX_SELLER_ID must be the numeric Seller ID from Partner Center - Account settings - Identifiers. It is not all digits, so the msstore CLI fails parsing it. The Publisher ID on the same page is a different value and is not this one."
            exit 1
          }

      - name: Set up the Store CLI
        if: >-
          env.MSIX_PUBLISHER != '' && env.STORE_PRODUCT_ID != '' &&
          (github.event_name == 'push' || inputs.microsoft_store)
        uses: microsoft/microsoft-store-apppublisher@v1.1

      # `reconfigure` rather than `configure`: the runner is fresh every time,
      # but `configure` prompts when it finds no existing credentials and a
      # prompt on a headless runner is a job that hangs until it is cancelled.
      #
      # The four values are passed as arguments because that is the only
      # interface the CLI offers. They are secrets, so they are never echoed —
      # and note that `msstore` writes them into a credential store on the
      # runner, which is discarded with the machine.
      - name: Sign in to Partner Center
        if: >-
          env.MSIX_PUBLISHER != '' && env.STORE_PRODUCT_ID != '' &&
          (github.event_name == 'push' || inputs.microsoft_store)
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.AZURE_AD_TENANT_ID }}" `
            --sellerId "${{ secrets.MSIX_SELLER_ID }}" `
            --clientId "${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}" `
            --clientSecret "${{ secrets.AZURE_AD_APPLICATION_SECRET }}"

      # Refuse to submit over a submission that is still being certified.
      #
      # **A submission in flight blocks the next one**, and pushing anyway is
      # not a no-op: at best the call is refused, at worst it replaces a
      # package that was part way through certification and the clock starts
      # again. Certification takes hours to days, so this is easy to do by
      # accident — a second release the same afternoon is all it takes.
      #
      # **An allow-list, not a block-list, and it fails closed.** Only a status
      # that is recognisably finished lets the submission through. A block-list
      # of in-flight states would silently pass anything Microsoft adds later,
      # which is exactly the failure this exists to prevent; and an
      # unrecognised or unreadable status stops the job rather than guessing.
      #
      # There is no override input on purpose. The escape hatch is the one that
      # already exists: the package is attached to this run, and if the Store
      # says something is in flight then Partner Center is where a human should
      # be looking before adding another.
      #
      # **It declines rather than fails.** A submission in certification is the
      # ordinary state of things for hours to days after every release, and
      # failing the run for it would paint every Android internal release in
      # that window red — which teaches people to stop reading red. The other
      # three stores in this workflow have nothing to do with it and did their
      # job. So the step reports `ready`, the submission is skipped, and the
      # warning says why.
      - name: Refuse to submit over one in certification
        id: settled
        if: >-
          env.MSIX_PUBLISHER != '' && env.STORE_PRODUCT_ID != '' &&
          (github.event_name == 'push' || inputs.microsoft_store)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $raw = (msstore submission status "$env:STORE_PRODUCT_ID" 2>&1 | Out-String)
          # Spectre.Console colours its tables; the escape codes would defeat
          # every match below.
          $status = $raw -replace '\x1b\[[0-9;]*m', ''
          Write-Output "--- msstore submission status ---"
          Write-Output $status.Trim()
          Write-Output "---------------------------------"

          # Finished, one way or the other: the last submission is live, was
          # withdrawn, or there has never been one. Anything else is either in
          # flight or is a state a person should look at before adding to it.
          #
          # `Canceled` is on this list because leaving it off cost a submission.
          # A cancelled submission is as finished as a published one -- nothing
          # is in certification and nothing is blocked -- but it matched neither
          # list, so the closed-declines branch below fired and the build was
          # not sent, on a run that was asked for precisely to send it. Note the
          # single L: that spelling is the Store's, not a typo.
          $settled = 'Published|None|Unpublished|Canceled|Cancelled'
          # Named so the message can say which one, rather than "not settled".
          $inFlight = 'PendingCommit|CommitStarted|CommitFailed|PreProcessing|' +
                      'PreProcessingFailed|Certification|CertificationFailed|' +
                      'PendingPublication|Publishing|PublishFailed|Release|ReleaseFailed'

          if ($status -match "\b($inFlight)\b") {
            $what = $Matches[1]
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "::warning::The Store still has a submission at '$what', and one in flight blocks the next -- so this build was not sent. Wait for it to settle and run this again; the package is attached to this run if it needs to go in by hand."
            exit 0
          }
          if ($status -match "\b($settled)\b") {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Output "the last submission is settled ($($Matches[1])); safe to submit"
            exit 0
          }
          # Declines closed. An unrecognised status is far more likely to be a
          # new state than a finished one, and the cost of guessing wrong is a
          # certification run somebody has to unpick.
          "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "::warning::Could not tell whether a submission is in flight -- the status above matched nothing known, so this build was not sent. Check Partner Center; if the Store has added a status, add it to the list in publish.yml."
          exit 0

      # The store package by name, not the first `.msix` in the folder.
      #
      # Both packages are built into the same directory and only one of them is
      # submittable: the sideload build is test-signed and carries the pubspec
      # identity. Picking by glob is how the wrong file gets uploaded, and
      # Partner Center's answer to that is a PublisherDisplayName mismatch that
      # reads like a broken workflow. `docs/RELEASING.md` has the full story.
      - name: Submit to the Microsoft Store
        if: >-
          steps.settled.outputs.ready == 'true' &&
          env.MSIX_PUBLISHER != '' && env.STORE_PRODUCT_ID != '' &&
          (github.event_name == 'push' || inputs.microsoft_store)
        working-directory: app
        shell: pwsh
        run: |
          $package = "build/windows/x64/runner/Release/mumbleway-store-${{ env.MSIX_VERSION }}.msix"
          if (-not (Test-Path $package)) {
            Write-Output "::error::$package was not built. The store package is only produced when MSIX_PUBLISHER is set."
            exit 1
          }
          Write-Output "submitting $(Split-Path $package -Leaf) as version ${{ env.MSIX_VERSION }}"
          msstore publish $package -id "${{ env.STORE_PRODUCT_ID }}"

      # Said here rather than left for somebody to discover on the dashboard.
      # A successful submission is not a published app: it is a package handed
      # to certification, which takes hours to days and can still come back.
      - name: What happens next
        if: >-
          success() && steps.settled.outputs.ready == 'true' &&
          env.MSIX_PUBLISHER != '' && env.STORE_PRODUCT_ID != '' &&
          (github.event_name == 'push' || inputs.microsoft_store)
        shell: pwsh
        run: |
          Write-Output "::notice::Submitted ${{ env.MSIX_VERSION }} to the Microsoft Store. Certification takes hours to days; the Store shows the old version until it passes. Watch it in Partner Center, and do not submit again until this one settles -- a submission in flight blocks the next."

  # ---------------------------------------------------------------------------
  # Microsoft Store — the Arm64 package
  # ---------------------------------------------------------------------------
  # A second package rather than a second job doing the same thing: Partner
  # Center accepts one submission carrying both architectures, and picks per
  # machine at install time. Without this an Arm laptop installs the x64 build
  # and runs it under emulation, which for an app doing per-block DSP on the
  # audio thread is the difference between working and not.
  #
  # It has to build on an Arm machine -- `flutter build windows` has no
  # --target-platform and the architecture follows the host.
  # BLOCKED UPSTREAM, and off until that changes: there is no Arm64 Flutter SDK
  # for Windows and `flutter build windows` cannot cross-compile one, so no Arm
  # binary can be produced by either route today. The full reasoning, and the
  # measurements behind it, are on the windows-arm64 job in build.yml.
  #
  # Set the repository variable ENABLE_WINDOWS_ARM64 to "true" to run it.
  msix-arm64:
    name: Windows MSIX (ARM64)
    if: vars.ENABLE_WINDOWS_ARM64 == 'true'
    runs-on: windows-11-arm
    env:
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      # Same version rule as the x64 package. The two architectures of one
      # submission must carry the *same* version, so this is deliberately the
      # identical computation rather than a second one that could drift.
      - name: Work out the package version
        shell: pwsh
        working-directory: app
        run: |
          $found = Select-String -Path pubspec.yaml -Pattern '^version:\s*(\d+)\.(\d+)\.' |
                   Select-Object -First 1
          if (-not $found) {
            Write-Output "::error::No 'version:' line in app/pubspec.yaml."
            exit 1
          }
          $major = [int]$found.Matches[0].Groups[1].Value
          $minor = [int]$found.Matches[0].Groups[2].Value
          $build = [int]'${{ github.run_number }}'
          if ($major -lt 1) {
            Write-Output "::error::MSIX versions cannot start with 0."
            exit 1
          }
          "MSIX_VERSION=$major.$minor.$build.0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "packaging as $major.$minor.$build.0"

      - name: Confirm the output is arm64
        shell: pwsh
        working-directory: app
        run: |
          if (-not (Test-Path build/windows/arm64/runner/Release)) {
            $found = (Get-ChildItem build/windows -Directory -ErrorAction SilentlyContinue).Name -join ', '
            Write-Output "::error::No arm64 build output; Flutter produced: $found."
            exit 1
          }

      - name: Package for the Store
        if: env.MSIX_PUBLISHER != ''
        working-directory: app
        run: >
          dart run msix:create --build-windows false --store --architecture arm64
          --version "${{ env.MSIX_VERSION }}"
          --output-name "mumbleway-store-arm64-${{ env.MSIX_VERSION }}"
          --publisher "${{ secrets.MSIX_PUBLISHER }}"
          --identity-name "${{ secrets.MSIX_IDENTITY_NAME }}"
          --publisher-display-name "${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}"

      - name: Say what is in the package
        if: env.MSIX_PUBLISHER != ''
        working-directory: app
        shell: pwsh
        run: |
          $msix = Get-ChildItem build/windows/arm64/runner/Release/*.msix | Select-Object -First 1
          if (-not $msix) { Write-Output "::error::no .msix was produced"; exit 1 }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($msix.FullName)
          try {
            $reader = New-Object System.IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open())
            $xml = [xml]$reader.ReadToEnd()
          } finally { $zip.Dispose() }
          $identity = $xml.Package.Identity
          Write-Output "file    : $($msix.Name)"
          Write-Output "version : $($identity.Version)"
          Write-Output "arch    : $($identity.ProcessorArchitecture)"
          if ($identity.ProcessorArchitecture -ne 'arm64') {
            Write-Output "::error::Package declares $($identity.ProcessorArchitecture), not arm64."
            exit 1
          }
          if ($xml.Package.Properties.PublisherDisplayName -eq 'MumbleWay') {
            Write-Output "::error::PublisherDisplayName is still the pubspec default; Partner Center will reject this."
            exit 1
          }

      - uses: actions/upload-artifact@v4
        if: env.MSIX_PUBLISHER != ''
        with:
          name: mumbleway-arm64-msix
          path: app/build/windows/arm64/runner/Release/*.msix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mac App Store — signed .pkg
  # ---------------------------------------------------------------------------
  # Shares nothing with the TestFlight job but the account. macOS wants two
  # certificates rather than one — the app is signed with a distribution
  # identity, then wrapped in an installer signed with a *different* one — and
  # neither of them is the iOS certificate. Getting that wrong produces a
  # package that uploads happily and is rejected some hours later.
  mac-app-store:
    name: Mac App Store
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing material
        id: gate
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::notice::MACOS_CERTIFICATE_P12 is not set - skipping the Mac App Store build."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
      - uses: arduino/setup-protoc@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Both certificates go into one temporary keychain, which the runner
      # discards with itself. The second import must not create a keychain of
      # its own: it would replace the first, and the packaging step then fails
      # looking for an identity that was imported and thrown away.
      #
      # Both must also name the same keychain password, and that is a separate
      # thing from either certificate's password. Left unset, the action
      # invents a random one per invocation: the first created the keychain
      # with its own, the second then ran
      #
      #   security set-key-partition-list ... -k <a different random password>
      #
      # against the keychain the first had made, and failed with "the user name
      # or passphrase you entered is not correct" — which reads like a rejected
      # certificate password and is not one. The `security import` immediately
      # above it had already succeeded, which is the step the p12 password is
      # actually used by.
      #
      # The value is not a secret. It guards a keychain that exists for the
      # length of one job on a machine that is destroyed afterwards, and it
      # never leaves the runner.
      - name: Import the application certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          keychain: signing_temp
          keychain-password: mumbleway-${{ github.run_id }}

      - name: Import the installer certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          keychain: signing_temp
          keychain-password: mumbleway-${{ github.run_id }}
          create-keychain: false

      - name: Install provisioning profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.MACOS_PROVISIONING_PROFILE }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.provisionprofile

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Point the release build at the distribution profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          profile=~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.provisionprofile
          security cms -D -i "$profile" > /tmp/pp.plist
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/pp.plist)

          # Read out of the keychain rather than written down here. The portal
          # issues "Apple Distribution" to newer accounts and "3rd Party Mac
          # Developer Application" to older ones; both sign a store build, and
          # naming either one breaks every account that has the other.
          # -E because this runs on BSD sed, which has no alternation in a
          # basic regex and would silently match nothing.
          app_id=$(security find-identity -v -p codesigning \
            | sed -nE 's/.*"((Apple Distribution|3rd Party Mac Developer Application)[^"]*)".*/\1/p' \
            | head -1)
          test -n "$app_id" || { echo "::error::No application signing identity in the keychain."; exit 1; }

          # A different certificate, and not listed under -p codesigning:
          # signing an installer is not code signing as far as security(1) is
          # concerned, so leaving the flag on finds nothing.
          installer_id=$(security find-identity -v \
            | sed -nE 's/.*"((3rd Party Mac Developer Installer|Apple Distribution Installer)[^"]*)".*/\1/p' \
            | head -1)
          test -n "$installer_id" || { echo "::error::No installer signing identity in the keychain."; exit 1; }
          echo "INSTALLER_IDENTITY=$installer_id" >> $GITHUB_ENV

          cat >> app/macos/Flutter/Flutter-Release.xcconfig <<EOF
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$uuid
          CODE_SIGN_IDENTITY=$app_id
          EOF

          # The Runner target carries these itself, and a target setting beats
          # an xcconfig, so everything above is ignored until they are gone.
          # Automatic signing on a runner goes looking for a development
          # profile it can ask Apple to create, which needs a signed-in account
          # the runner has not got.
          # CODE_SIGN_IDENTITY = "-" goes with them, and leaving it behind was
          # the whole of the next failure. It means ad-hoc: the app is signed
          # by nobody, so no provisioning profile is embedded and the
          # entitlements file is not applied. App Store Connect then rejects
          # the upload for having no sandbox — which reads as a missing
          # entitlement and is really a missing signature.
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = "";//g' \
            -e 's/CODE_SIGN_IDENTITY = "-";//g' \
            app/macos/Runner.xcodeproj/project.pbxproj

          echo "signing with profile $uuid"

      - name: Show the installed signing identities
        if: steps.gate.outputs.ready == 'true'
        run: |
          security find-identity -v | sed 's/([0-9A-F]\{40\})/(...)/'
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.provisionprofile > /tmp/pp.plist
          printf 'profile: %s expires=%s\n' \
            "$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/pp.plist)" \
            "$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/pp.plist)"

      - name: Build the signed app
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          flutter pub get
          # The build number has to rise with every upload: App Store Connect
          # and Play both reject one they have seen before, and a rejection
          # arrives after the build, not before it. run_number only ever goes
          # up, which is the whole requirement — the version in pubspec.yaml
          # stays the human-facing one.
          flutter build macos --release --build-number=${{ github.run_number }}

      # productbuild, not pkgbuild. The store wants a distribution package;
      # pkgbuild makes a component package, which uploads and is then rejected
      # for having no distribution definition in it.
      - name: Package the installer
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "packaging $app"
          xcrun productbuild \
            --component "$app" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            build/macos/mumbleway.pkg
          pkgutil --check-signature build/macos/mumbleway.pkg | head -5

      # altool locates the key by id, in one of a few fixed directories. It
      # goes to a file rather than an argument or an exported variable: an
      # argument is visible in the process list, and $GITHUB_ENV would put a
      # copy of a private key somewhere GitHub's secret masking cannot see it.
      - name: Upload to App Store Connect
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f build/macos/mumbleway.pkg -t macos \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Kept even when the upload fails, for the same reason as the iOS one: a
      # package that built and signed is worth having in hand.
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: mumbleway-macos-pkg
          path: app/build/macos/*.pkg
          if-no-files-found: warn
