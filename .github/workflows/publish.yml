name: publish

# Store submissions. Separate from `build` on purpose: that runs on every push
# and must stay fast and side-effect free, while this uploads to real stores.
#
# Every job is gated on its own secrets and skips cleanly when they are absent,
# so this is safe to have in the repository before any store account exists.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track'
        required: false
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]

env:
  FLUTTER_VERSION: '3.44.8'
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  # ---------------------------------------------------------------------------
  # Google Play — signed App Bundle to the internal track
  # ---------------------------------------------------------------------------
  google-play:
    name: Google Play
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      PLAY_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing material
        id: gate
        run: |
          if [ -z "$ANDROID_KEYSTORE" ]; then
            echo "::notice::ANDROID_KEYSTORE is not set - skipping Play upload."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
      - uses: arduino/setup-protoc@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: steps.gate.outputs.ready == 'true'

      - name: Add Android Rust targets
        if: steps.gate.outputs.ready == 'true'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Written to disk only inside the runner, and only for this job. Gradle
      # reads it through key.properties; nothing lands in the repository.
      - name: Restore the upload key
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > app/android/upload-keystore.jks

          # The keystore is a file; the passwords are not written down at all.
          # They reach Gradle through the environment on the build step below,
          # because a heredoc expands `$` and a backtick, and a .properties
          # file then treats `\` as an escape — so a password containing any
          # of the three arrives as something else, and is reported as wrong
          # when it was right everywhere anybody typed it.

      # Named, before nine minutes of Rust build ends in a null pointer.
      # bundletool reports a missing alias or password as
      # "java.lang.NullPointerException (no error message)", which says
      # nothing about which of the three it wanted.
      - name: Check the signing secrets are all present
        if: steps.gate.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            eval "value=\${$name}"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets not set:$missing"
            exit 1
          fi
          # The alias has to exist in the keystore as well as in the secrets.
          keytool -list -keystore app/android/upload-keystore.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -alias "$ANDROID_KEY_ALIAS" > /dev/null             || { echo "::error::ANDROID_KEY_ALIAS names no key in the keystore. Aliases it does hold:";                  keytool -list -keystore app/android/upload-keystore.jks                    -storepass "$ANDROID_KEYSTORE_PASSWORD" | grep -i "alias name" || true;                  exit 1; }
          echo "signing secrets present, alias found"

      - name: Build App Bundle
        env:
          ANDROID_KEYSTORE_PATH: upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          flutter pub get
          # The build number has to rise with every upload: App Store Connect
          # and Play both reject one they have seen before, and a rejection
          # arrives after the build, not before it. run_number only ever goes
          # up, which is the whole requirement — the version in pubspec.yaml
          # stays the human-facing one.
          flutter build appbundle --release --build-number=${{ github.run_number }}

      - name: Upload to Play
        if: steps.gate.outputs.ready == 'true' && env.PLAY_SERVICE_ACCOUNT != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mumbleway.mumbleway
          releaseFiles: app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          # Live on the internal track, draft everywhere else.
          #
          # Internal testing reaches only people who have been named in the
          # console by hand, and the whole point of it is a short loop: a fix
          # goes out, somebody rides with it, they say whether it worked. A
          # draft sitting in the console waiting to be promoted breaks that
          # loop at the least useful moment, and every build in this project so
          # far has needed a human to go and click a button that has never once
          # been used to reject anything.
          #
          # Every wider track still stops for a person. Alpha, beta and
          # production reach people who did not opt into a test build, and a
          # release that goes live because a workflow ran is exactly the sort
          # of thing that should not.
          status: ${{ (inputs.track || 'internal') == 'internal' && 'completed' || 'draft' }}

      - name: Remove signing material
        if: always() && steps.gate.outputs.ready == 'true'
        run: rm -f app/android/upload-keystore.jks app/android/key.properties

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: mumbleway-play-bundle
          path: app/build/app/outputs/bundle/release/*.aab

  # ---------------------------------------------------------------------------
  # App Store Connect — signed build to TestFlight
  # ---------------------------------------------------------------------------
  testflight:
    name: TestFlight
    runs-on: macos-latest
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing material
        id: gate
        run: |
          if [ -z "$APPLE_CERTIFICATE_P12" ]; then
            echo "::notice::APPLE_CERTIFICATE_P12 is not set - skipping TestFlight upload."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
      - uses: arduino/setup-protoc@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Imports into a temporary keychain that is discarded with the runner, so
      # the certificate never persists anywhere.
      - name: Import signing certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.mobileprovision

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The checked-in plist carries a placeholder rather than a real team id,
      # so the repository holds no account identifiers. The same goes for the
      # Xcode project: the team is injected into the release config here rather
      # than committed, and without it the archive fails outright with
      # "Signing for Runner requires a development team".
      - name: Point the release build at the distribution profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c \
            "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" app/ios/ExportOptions.plist

          profile=$(ls ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision | head -1)
          security cms -D -i "$profile" > /tmp/pp.plist
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/pp.plist)

          # The export step needs the same profile named explicitly. Left on
          # automatic it asks Xcode to look one up through a signed-in account,
          # which a runner does not have, and fails with "No Accounts" after
          # the archive has already signed correctly.
          /usr/libexec/PlistBuddy -c \
            "Set :provisioningProfiles:com.mumbleway.mumbleway $uuid" \
            app/ios/ExportOptions.plist

          # Manual signing, pinned to the profile that was actually installed.
          # Automatic signing goes looking for a *development* profile it can
          # ask Apple to create, which a runner cannot do and which is not what
          # a store build wants anyway.
          cat >> app/ios/Flutter/Release.xcconfig <<EOF
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$uuid
          EOF

          # The Runner target pins a developer identity for the device SDK, and
          # a target build setting beats an xcconfig, so this one has to be
          # rewritten in place rather than overridden.
          sed -i '' \
            's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";/g' \
            app/ios/Runner.xcodeproj/project.pbxproj

          echo "signing with profile $uuid"

      - name: Show the installed signing identities
        if: steps.gate.outputs.ready == 'true'
        run: |
          echo "--- identities ---"
          security find-identity -v -p codesigning | sed 's/([0-9A-F]\{40\})/(...)/'
          echo "--- profiles ---"
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -e "$p" ] || continue
            security cms -D -i "$p" > /tmp/pp.plist 2>/dev/null || continue
            printf '%s: app-id=%s expires=%s\n' \
              "$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/pp.plist)" \
              "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /tmp/pp.plist)" \
              "$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/pp.plist)"
          done

      - name: Build signed IPA
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          flutter pub get
          # The build number has to rise with every upload: App Store Connect
          # and Play both reject one they have seen before, and the rejection
          # arrives after the build rather than before it. run_number only ever
          # goes up, which is the whole requirement — the version in
          # pubspec.yaml stays the human-facing one.
          flutter build ipa --release --build-number=${{ github.run_number }} \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload to TestFlight
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: app/build/ios/ipa/mumbleway.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY }}

      # Housekeeping, so it must not turn a successful publish into a failed
      # run: the build is already uploaded by this point, and a red job would
      # say otherwise. The step still goes red on its own, which is where the
      # reason will be.
      #
      # `success()` is spelled out rather than left implicit. GitHub applies it
      # to any `if` that does not mention status, so this reads the same either
      # way today — but the property it protects is not decorative: expiring
      # every older build after an upload that did not happen leaves testers
      # with nothing installable at all. Written down so that adding
      # `always()` here later has to be a decision rather than an accident.
      - name: Expire superseded TestFlight builds
        if: success() && steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          BUNDLE_ID: com.mumbleway.mumbleway
          # Only builds numbered below this one are touched, so it does not
          # matter that the upload above is still processing and invisible.
          CURRENT_BUILD: ${{ github.run_number }}
        run: ruby .github/scripts/expire-testflight-builds.rb

      # Kept even when the upload fails: a build that archived and exported
      # correctly is worth having in hand, and losing it because App Store
      # Connect rejected the credentials wastes twenty minutes to learn nothing.
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: mumbleway-ios-ipa
          path: app/build/ios/ipa/*.ipa
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Microsoft Store — MSIX package
  # ---------------------------------------------------------------------------
  # Partner Center submission needs an Azure AD application tied to the store
  # account, which is more setup than most projects want. This produces the
  # package and attaches it; uploading it is a drag-and-drop in Partner Center.
  msix:
    name: Windows MSIX
    runs-on: windows-latest
    env:
      MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Ninja
        run: choco install ninja -y --no-progress
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      # Two different artifacts, and the difference matters. A store package is
      # unsigned here because Partner Center re-signs it, so it cannot be
      # installed locally; the sideload package is test-signed and can. Which
      # one gets built depends on whether the store identity is configured.
      - name: Package for the Store
        if: env.MSIX_PUBLISHER != ''
        working-directory: app
        run: >
          dart run msix:create --build-windows false --store
          --publisher "${{ secrets.MSIX_PUBLISHER }}"
          --identity-name "${{ secrets.MSIX_IDENTITY_NAME }}"
          --publisher-display-name "${{ secrets.MSIX_PUBLISHER_DISPLAY_NAME }}"

      - name: Package for sideloading
        if: env.MSIX_PUBLISHER == ''
        working-directory: app
        run: |
          echo "::notice::MSIX_PUBLISHER is not set - building a test-signed sideload package instead of a Store package."
          dart run msix:create --build-windows false --install-certificate false

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-msix
          path: app/build/windows/x64/runner/Release/*.msix
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Mac App Store — signed .pkg
  # ---------------------------------------------------------------------------
  # Shares nothing with the TestFlight job but the account. macOS wants two
  # certificates rather than one — the app is signed with a distribution
  # identity, then wrapped in an installer signed with a *different* one — and
  # neither of them is the iOS certificate. Getting that wrong produces a
  # package that uploads happily and is rejected some hours later.
  mac-app-store:
    name: Mac App Store
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for signing material
        id: gate
        run: |
          if [ -z "$MACOS_CERTIFICATE_P12" ]; then
            echo "::notice::MACOS_CERTIFICATE_P12 is not set - skipping the Mac App Store build."
            echo "ready=false" >> $GITHUB_OUTPUT
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.ready == 'true'
      - uses: arduino/setup-protoc@v3
        if: steps.gate.outputs.ready == 'true'
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Both certificates go into one temporary keychain, which the runner
      # discards with itself. The second import must not create a keychain of
      # its own: it would replace the first, and the packaging step then fails
      # looking for an identity that was imported and thrown away.
      #
      # Both must also name the same keychain password, and that is a separate
      # thing from either certificate's password. Left unset, the action
      # invents a random one per invocation: the first created the keychain
      # with its own, the second then ran
      #
      #   security set-key-partition-list ... -k <a different random password>
      #
      # against the keychain the first had made, and failed with "the user name
      # or passphrase you entered is not correct" — which reads like a rejected
      # certificate password and is not one. The `security import` immediately
      # above it had already succeeded, which is the step the p12 password is
      # actually used by.
      #
      # The value is not a secret. It guards a keychain that exists for the
      # length of one job on a machine that is destroyed afterwards, and it
      # never leaves the runner.
      - name: Import the application certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          keychain: signing_temp
          keychain-password: mumbleway-${{ github.run_id }}

      - name: Import the installer certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          keychain: signing_temp
          keychain-password: mumbleway-${{ github.run_id }}
          create-keychain: false

      - name: Install provisioning profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.MACOS_PROVISIONING_PROFILE }}" | base64 -d \
            > ~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.provisionprofile

      - uses: subosito/flutter-action@v2
        if: steps.gate.outputs.ready == 'true'
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Point the release build at the distribution profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          set -euo pipefail
          profile=~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.provisionprofile
          security cms -D -i "$profile" > /tmp/pp.plist
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /tmp/pp.plist)

          # Read out of the keychain rather than written down here. The portal
          # issues "Apple Distribution" to newer accounts and "3rd Party Mac
          # Developer Application" to older ones; both sign a store build, and
          # naming either one breaks every account that has the other.
          # -E because this runs on BSD sed, which has no alternation in a
          # basic regex and would silently match nothing.
          app_id=$(security find-identity -v -p codesigning \
            | sed -nE 's/.*"((Apple Distribution|3rd Party Mac Developer Application)[^"]*)".*/\1/p' \
            | head -1)
          test -n "$app_id" || { echo "::error::No application signing identity in the keychain."; exit 1; }

          # A different certificate, and not listed under -p codesigning:
          # signing an installer is not code signing as far as security(1) is
          # concerned, so leaving the flag on finds nothing.
          installer_id=$(security find-identity -v \
            | sed -nE 's/.*"((3rd Party Mac Developer Installer|Apple Distribution Installer)[^"]*)".*/\1/p' \
            | head -1)
          test -n "$installer_id" || { echo "::error::No installer signing identity in the keychain."; exit 1; }
          echo "INSTALLER_IDENTITY=$installer_id" >> $GITHUB_ENV

          cat >> app/macos/Flutter/Flutter-Release.xcconfig <<EOF
          DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}
          CODE_SIGN_STYLE=Manual
          PROVISIONING_PROFILE_SPECIFIER=$uuid
          CODE_SIGN_IDENTITY=$app_id
          EOF

          # The Runner target carries these itself, and a target setting beats
          # an xcconfig, so everything above is ignored until they are gone.
          # Automatic signing on a runner goes looking for a development
          # profile it can ask Apple to create, which needs a signed-in account
          # the runner has not got.
          # CODE_SIGN_IDENTITY = "-" goes with them, and leaving it behind was
          # the whole of the next failure. It means ad-hoc: the app is signed
          # by nobody, so no provisioning profile is embedded and the
          # entitlements file is not applied. App Store Connect then rejects
          # the upload for having no sandbox — which reads as a missing
          # entitlement and is really a missing signature.
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/PROVISIONING_PROFILE_SPECIFIER = "";//g' \
            -e 's/CODE_SIGN_IDENTITY = "-";//g' \
            app/macos/Runner.xcodeproj/project.pbxproj

          echo "signing with profile $uuid"

      - name: Show the installed signing identities
        if: steps.gate.outputs.ready == 'true'
        run: |
          security find-identity -v | sed 's/([0-9A-F]\{40\})/(...)/'
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/mumbleway.provisionprofile > /tmp/pp.plist
          printf 'profile: %s expires=%s\n' \
            "$(/usr/libexec/PlistBuddy -c 'Print :Name' /tmp/pp.plist)" \
            "$(/usr/libexec/PlistBuddy -c 'Print :ExpirationDate' /tmp/pp.plist)"

      - name: Build the signed app
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          flutter pub get
          # The build number has to rise with every upload: App Store Connect
          # and Play both reject one they have seen before, and a rejection
          # arrives after the build, not before it. run_number only ever goes
          # up, which is the whole requirement — the version in pubspec.yaml
          # stays the human-facing one.
          flutter build macos --release --build-number=${{ github.run_number }}

      # productbuild, not pkgbuild. The store wants a distribution package;
      # pkgbuild makes a component package, which uploads and is then rejected
      # for having no distribution definition in it.
      - name: Package the installer
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        run: |
          set -euo pipefail
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "packaging $app"
          xcrun productbuild \
            --component "$app" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            build/macos/mumbleway.pkg
          pkgutil --check-signature build/macos/mumbleway.pkg | head -5

      # altool locates the key by id, in one of a few fixed directories. It
      # goes to a file rather than an argument or an exported variable: an
      # argument is visible in the process list, and $GITHUB_ENV would put a
      # copy of a private key somewhere GitHub's secret masking cannot see it.
      - name: Upload to App Store Connect
        if: steps.gate.outputs.ready == 'true'
        working-directory: app
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$API_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app -f build/macos/mumbleway.pkg -t macos \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      # Kept even when the upload fails, for the same reason as the iOS one: a
      # package that built and signed is worth having in hand.
      - uses: actions/upload-artifact@v4
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: mumbleway-macos-pkg
          path: app/build/macos/*.pkg
          if-no-files-found: warn
