name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.8'

  # libopus declares cmake_minimum_required below 3.5 and CMake 4 removed that
  # compatibility. .cargo/config.toml sets this too, for local builds, but cargo
  # finds that file by walking up from the *working directory* -- and the Xcode
  # script phase that cargokit runs for iOS executes from DerivedData, outside
  # the repository, so the file is never seen. Setting it here puts it in the
  # environment, which every nested process inherits regardless.
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'
  # Deliberately no global RUSTFLAGS=-D warnings: that applies to dependencies
  # as well, so an upstream crate's warning would break our build. Warnings are
  # denied for our own code through clippy instead.

jobs:
  # ---------------------------------------------------------------------------
  # Engine and UI tests. Runs first and gates the platform builds.
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'core -> target'

      # prost-build shells out to protoc; cpal needs the ALSA headers on Linux.
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check formatting
        working-directory: core
        run: cargo fmt --check

      - name: Clippy
        working-directory: core
        run: cargo clippy --all-targets -- -D warnings

      # The hardware tests are #[ignore]d and stay excluded: CI runners have no
      # audio devices, so they would fail for reasons unrelated to the code.
      - name: Engine tests
        working-directory: core
        run: cargo test --lib

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve Dart dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Widget tests
        working-directory: app
        run: flutter test

  # ---------------------------------------------------------------------------
  # Windows desktop
  # ---------------------------------------------------------------------------
  windows:
    name: Windows
    needs: test
    runs-on: windows-latest
    # Pinned for the reason `publish.yml`'s `msix` job gives at length: the
    # runner's default `run:` shell changed from Git bash to pwsh, which turns
    # a `\` continuation into an argument. Nothing here has one *today*, so
    # this job did not break — which is precisely why it is worth pinning
    # before somebody writes the next multi-line command.
    defaults:
      run:
        shell: bash
    env:
      # Lifted to job level so the signing steps can test for its presence in
      # an `if:` — secrets are not readable from `if:` expressions directly.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # libopus is built from source by audiopus_sys via CMake. That CMake runs
      # inside MSBuild, whose Visual Studio generator breaks there, so cargokit
      # forces the Ninja generator on Windows -- which means ninja must be on
      # PATH. See rust_builder/cargokit/cmake/cargokit.cmake.
      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # The Ninja generator, unlike the Visual Studio one, expects cl.exe and
      # the INCLUDE/LIB variables to already be in the environment.
      - uses: ilammy/msvc-dev-cmd@v1

      # Build the engine on its own first. `flutter build windows` runs cargo
      # through MSBuild, which swallows its output and reports only
      # "exited with code -1" -- useless for diagnosing a native build. This
      # step fails fast with the real compiler error instead.
      - name: Build engine
        working-directory: app/rust
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      - name: Package
        working-directory: app/build/windows/x64/runner/Release
        run: 7z a -tzip ../../../../../../mumbleway-windows-x64.zip .

      # --- code signing ---------------------------------------------------
      # Unsigned Windows binaries trip SmartScreen, which tells the user the
      # app is "unrecognised" — a bad first impression for a voice client that
      # asks for microphone access.
      #
      # SignPath's Foundation tier signs open-source projects for free, and the
      # private key never leaves their infrastructure: the binary is uploaded,
      # signed server-side and returned. See README for the one-time setup.
      #
      # Everything below is skipped when the token is absent, so forks and pull
      # requests still produce a usable (unsigned) build rather than failing.
      - name: Upload unsigned build for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-unsigned
          path: mumbleway-windows-x64.zip
          if-no-files-found: error

      - name: Sign with SignPath
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mumbleway' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace the package with the signed one
        if: env.SIGNPATH_API_TOKEN != '' && steps.signpath.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Filter *.zip -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed package" }
          Move-Item $signed.FullName mumbleway-windows-x64.zip -Force
          Write-Host "Replaced package with signed build: $($signed.Name)"

      - name: Report signing status
        shell: pwsh
        run: |
          if ('${{ env.SIGNPATH_API_TOKEN }}' -eq '') {
            Write-Host "::notice::SIGNPATH_API_TOKEN is not set - this build is UNSIGNED."
          } else {
            Write-Host "::notice::Windows build signed via SignPath."
          }

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-x64
          path: mumbleway-windows-x64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Windows on Arm
  # ---------------------------------------------------------------------------
  # A separate job rather than a matrix over the one above, because it is *not*
  # the same build. `flutter build windows` has no --target-platform: the
  # architecture follows the host, so this has to run on an Arm machine, and
  # cross-compiling from x64 is not supported upstream.
  #
  # windows-11-arm runners are free for public repositories, which this is.
  #
  # Kept out of `needs` for anything downstream on purpose. Arm is the newer,
  # less-travelled path here; if it breaks it should be visible without taking
  # the x64 release with it.
  # ---------------------------------------------------------------------------
  # BLOCKED UPSTREAM, and off until that changes. Set the repository variable
  # ENABLE_WINDOWS_ARM64 to "true" to run it.
  #
  # Flutter cannot currently produce a Windows Arm64 binary at all, by either
  # route, and both halves were measured rather than assumed:
  #
  #   * There is no Arm64 Flutter SDK for Windows. Every architecture-tagged
  #     entry in releases_windows.json is x64 and none is arm64, so there is
  #     nothing to install on an Arm runner. flutter-action fails with
  #     "Unable to determine Flutter version for ... architecture: arm64".
  #   * `flutter build windows` has no --target-platform, so an x64 host cannot
  #     cross-compile one either. See flutter/flutter#62597 and #129808.
  #
  # Running the x64 SDK under emulation on an Arm runner is not a workaround: it
  # detects an x64 host and builds an x64 app, which is what an Arm machine
  # already gets from the x64 job. The "Confirm the output is arm64" step below
  # exists to catch exactly that rather than ship a mislabelled binary.
  #
  # Everything else here does work and was proven on a real runner -- the Rust
  # core compiles natively for aarch64, Ninja installs, and msvc-dev-cmd sets up
  # the Arm64 toolchain. When Flutter ships the SDK this should need no more
  # than flipping the variable.
  windows-arm64:
    name: Windows ARM64
    needs: test
    if: vars.ENABLE_WINDOWS_ARM64 == 'true'
    runs-on: windows-11-arm
    # See the `windows` job above.
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'
          # Its own cache. Sharing one with the x64 job would have each
          # overwrite the other's artifacts for a different architecture.
          key: arm64

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # arch: arm64 is the whole point. Left at its default this sets up an x64
      # cl.exe and the native build produces x64 objects that fail to link
      # against an arm64 Flutter runner, late and confusingly.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: arm64

      - name: Build engine
        working-directory: app/rust
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Everything above assumes it is on an Arm machine with an Arm toolchain,
      # and each piece of that can be true or false independently. Checked here,
      # before a twenty-minute build, because the failure this guards against is
      # not a crash: it is an x64 binary in a file named arm64, which installs
      # on the wrong machines and runs on none of them.
      - name: Confirm this really is an Arm toolchain
        shell: pwsh
        run: |
          $host_arch = $env:PROCESSOR_ARCHITECTURE
          Write-Output "runner architecture : $host_arch"
          Write-Output "rustc host          : $((rustc -vV | Select-String '^host:') -replace 'host:\s*','')"
          Write-Output "dart                : $(dart --version 2>&1)"
          if ($host_arch -ne 'ARM64') {
            Write-Output "::error::Expected an ARM64 runner, got '$host_arch'. windows-11-arm may have changed."
            exit 1
          }

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release

      # Flutter writes into an architecture subdirectory, so the presence of
      # build/windows/arm64 *is* the evidence that an arm64 build happened.
      # An x64 SDK running under emulation would have produced build/windows/x64
      # and this catches that rather than packaging it.
      - name: Confirm the output is arm64
        shell: pwsh
        working-directory: app
        run: |
          if (-not (Test-Path build/windows/arm64/runner/Release)) {
            $found = (Get-ChildItem build/windows -Directory -ErrorAction SilentlyContinue).Name -join ', '
            Write-Output "::error::No arm64 build output. Flutter produced: $found. The SDK was probably x64 running under emulation."
            exit 1
          }
          $exe = Get-Item build/windows/arm64/runner/Release/mumbleway.exe
          Write-Output "built $($exe.Name), $([math]::Round($exe.Length/1MB,1)) MB"

      - name: Package
        working-directory: app/build/windows/arm64/runner/Release
        run: 7z a -tzip ../../../../../../mumbleway-windows-arm64.zip .

      - name: Upload unsigned build for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-arm64-unsigned
          path: mumbleway-windows-arm64.zip
          if-no-files-found: error

      - name: Sign with SignPath
        id: signpath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'mumbleway' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Replace the package with the signed one
        if: env.SIGNPATH_API_TOKEN != '' && steps.signpath.outcome == 'success'
        shell: pwsh
        run: |
          $signed = Get-ChildItem signed -Filter *.zip -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath returned no signed package" }
          Move-Item $signed.FullName mumbleway-windows-arm64.zip -Force
          Write-Host "Replaced package with signed build: $($signed.Name)"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-windows-arm64
          path: mumbleway-windows-arm64.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS desktop
  # ---------------------------------------------------------------------------
  macos:
    name: macOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Xcode hides the cargo output behind its own build phase, so compile the
      # engine separately first to get a readable error if it breaks.
      - name: Build engine
        working-directory: app/rust
        env:
          # Match the Xcode project so libopus's C objects and the Rust code
          # target the same OS version.
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: cargo build --release

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build macos --release

      - name: Package
        working-directory: app/build/macos/Build/Products/Release
        run: ditto -c -k --sequesterRsrc --keepParent mumbleway.app "$GITHUB_WORKSPACE/mumbleway-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-macos
          path: mumbleway-macos.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # iOS and iPadOS (one universal build; unsigned, as CI has no signing identity)
  # ---------------------------------------------------------------------------
  ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Compile-check the engine for the device target first. Flutter reports
      # any Xcode failure as "requires a selected Development Team", which is a
      # guess and hides the real cause; this surfaces it directly.
      #
      # `check` rather than `build`: it still runs the build scripts, so a
      # broken libopus compile is caught, but it does not link. A full `cargo
      # build` also links the cdylib, which the real build never does -- for
      # iOS, cargokit produces a static library that Xcode links, and Xcode is
      # what supplies libclang_rt (without it, libopus's stack probes leave
      # ___chkstk_darwin undefined).
      - name: Compile-check engine for aarch64-apple-ios
        working-directory: app/rust
        env:
          # Match the Xcode project, so libopus's C objects and the Rust code
          # agree. Left unset, the C build follows the SDK (26.5) while Rust
          # targets 10.0, and the linker complains the objects are too new.
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          rustup target add aarch64-apple-ios
          cargo check --release --target aarch64-apple-ios

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Unsigned: installing this on a device requires re-signing with your own
      # provisioning profile. It proves the target compiles and links.
      # --verbose is deliberate. Flutter reports every iOS build failure as
      # "requires a selected Development Team" and otherwise swallows
      # xcodebuild's output entirely, leaving nothing to diagnose. The extra
      # log volume is worth being able to see the actual error.
      - name: Build (unsigned)
        working-directory: app
        env:
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          flutter pub get
          if ! flutter build ios --release --no-codesign --verbose > /tmp/ios-build.log 2>&1; then
            # cargokit relays cargo's stderr line by line prefixed with SEVERE:,
            # and that output is long, so anchoring on a fixed number of context
            # lines misses the error. Match the error text itself, then show the
            # tail of the cargokit block where cargo's real failure lands.
            echo "===== errors ====="
            grep -nE "error\[|error:|panicked|could not compile|Compatibility with CMake|Undefined symbols|ld: |clang: error|fatal error" \
              /tmp/ios-build.log | grep -viE "warning" | head -50
            echo "===== end of cargokit output ====="
            awk '/Cargokit BuildTool failed/,0' /tmp/ios-build.log | tail -70
            echo "===== last 40 lines ====="
            tail -40 /tmp/ios-build.log
            exit 1
          fi

      - name: Package
        working-directory: app/build/ios/iphoneos
        run: ditto -c -k --sequesterRsrc --keepParent Runner.app "$GITHUB_WORKSPACE/mumbleway-ios-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-ios-unsigned
          path: mumbleway-ios-unsigned.zip
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Android phones and tablets
  # ---------------------------------------------------------------------------
  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'app/rust -> target'

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # cargokit cross-compiles the engine for each ABI, so those Rust targets
      # must exist before Gradle runs.
      - name: Add Android Rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build APKs
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: Build App Bundle
        working-directory: app
        run: flutter build appbundle --release

      - uses: actions/upload-artifact@v4
        with:
          name: mumbleway-android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  # The release job lives in `publish.yml`, not here.
  #
  # Both workflows run on `push: tags: ['v*']`, so two release jobs meant two
  # `softprops/action-gh-release` calls against the same tag in the same minute:
  # whichever finished second rewrote the other's name, body and flags. The one
  # that survives is the one that has the store packages, the changelog since
  # the previous tag, and the mutable/latest flags the release is supposed to
  # carry — none of which this workflow knows anything about.
