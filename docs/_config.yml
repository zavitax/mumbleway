# expires_at: null, то есть срок ему и правда не задан, — но предыдущее,
# NTASPRFjm, к 13.11.2026 отвечало 404 Unknown Invite, и всё это время
# оно стояло на сайте и в описаниях всех трёх магазинов. Так что ссылку
