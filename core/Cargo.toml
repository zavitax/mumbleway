[package]
name = "mumbleway-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Cross-platform Mumble client core: protocol, crypto, audio and reconnect logic"
# Matches the GPL-3.0 LICENSE at the repository root.
license = "GPL-3.0-or-later"

[lib]
name = "mumbleway_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# --- async runtime / networking -------------------------------------------
tokio = { version = "1", features = [
    "rt-multi-thread", "net", "time", "sync", "macros", "io-util",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = "0.13"
webpki-roots = "0.26"

# --- protocol --------------------------------------------------------------
prost = "0.13"
bytes = "1"

# --- crypto ----------------------------------------------------------------
aes = "0.8"
cipher = "0.4"
aes-gcm = "0.10"
rand = "0.8"

# --- audio -----------------------------------------------------------------
cpal = "0.18"
opus = "0.3"
nnnoiseless = { version = "0.5", default-features = false }

# --- misc ------------------------------------------------------------------
thiserror = "2"
anyhow = "1"
tracing = "0.1"
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
hex = "0.4.3"

[build-dependencies]
prost-build = "0.13"
