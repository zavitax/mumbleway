title: MumbleWay
tagline: Voice for motorcyclists

# Both are load-bearing and neither is inferred. This is a project site served
# from zavitax.github.io/mumbleway/, and GitHub Pages does not set `baseurl`
# for you — leave it out and every `relative_url` resolves to the user site
# root instead, so the whole navigation 404s while the pages themselves build
# perfectly. Setting it also keeps the store-registered policy URL,
# https://zavitax.github.io/mumbleway/privacy, exactly where it already is.
url: https://zavitax.github.io
baseurl: /mumbleway
description: >-
  A Mumble client built for wind and engine noise inside a helmet.
  Windows, macOS, iOS, iPadOS and Android.

# Pretty permalinks are deliberately NOT used. The privacy policy URL
# (/privacy) is registered with three app stores, and `permalink: pretty` would
# move it to /privacy/ and 404 the old one at the point a reviewer follows it.
# Default permalinks keep privacy.md serving from where it always has.

# Working notes that live beside the site rather than in it. They are in a
# public repository and nothing here is secret, but a release runbook is not a
# page and should not turn up in a search for the app.
exclude:
  - RELEASING.md
  - RECORDING.md
  - VOICE_MODEL.md
  - MUSIC_GATE.md
  - STORE_DESCRIPTION.md
  - STORE_LISTING.md

nav:
  - title: Overview
    url: /index.html
  - title: Settings
    url: /settings.html
  - title: On the road
    url: /scenarios.html
  - title: Your own server
    url: /server.html
  - title: Licences
    url: /licences.html
  - title: Privacy
    url: /privacy.html

repo: https://github.com/zavitax/mumbleway
mumble: https://www.mumble.info/
mumble_docs: https://www.mumble.info/documentation/
